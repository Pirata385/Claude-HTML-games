<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Operação Vermelho</title>
<!-- ============================== CSS ============================== -->
<style>
:root { --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; --accent: #ffd166; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #fff; font: 600 14px var(--mono); }
canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
.overlay {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  text-align: center; padding: 24px; background: radial-gradient(circle at 50% 40%, rgba(40, 10, 10, 0.75), rgba(0, 0, 0, 0.92));
}
.overlay h1 { margin: 0; font-size: clamp(28px, 7vw, 56px); letter-spacing: 0.12em; color: #e8e2d4; }
.overlay h1 span { color: #e3342f; }
.overlay p { margin: 0; color: #a59e90; font-weight: 500; max-width: 460px; }
.overlay button {
  font: inherit; font-size: 16px; cursor: pointer; padding: 11px 22px; border-radius: 9px; border: 2px solid #000;
  background: #4a3a14; color: var(--accent); box-shadow: inset 0 0 0 2px rgba(255, 209, 102, 0.45), 0 4px 0 #000;
}
.overlay a { color: #a59e90; }
.hud {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 10px;
  padding: 26px calc(14px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
  background: linear-gradient(transparent, rgba(0, 0, 0, 0.65)); transition: opacity 0.4s;
}
.hud button, .hud a {
  font: inherit; color: #fff; cursor: pointer; min-width: 38px; height: 34px; padding: 0 9px; border-radius: 8px; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.22);
}
.bar { flex: 1; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.18); position: relative; cursor: pointer; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: #e3342f; }
.time { min-width: 86px; text-align: right; color: #ccc; }
.idle .hud { opacity: 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<!-- ============================== HTML ============================== -->
<canvas id="stage" aria-label="Curta-metragem animada: Operação Vermelho"></canvas>
<div class="hud" id="hud" hidden>
  <button id="play" title="Pausar / continuar (espaço)" aria-label="Pausar">❚❚</button>
  <button id="restart" title="Recomeçar (R)" aria-label="Recomeçar">↺</button>
  <button id="mute" title="Som (M)" aria-label="Som">🔊</button>
  <div class="bar" id="bar"><i id="fill"></i></div>
  <span class="time" id="time">0:00 / 1:04</span>
  <a href="../../index.html#animacoes" title="Voltar ao menu">Menu</a>
</div>
<div class="overlay" id="intro">
  <h1>OPERAÇÃO <span>VERMELHO</span></h1>
  <p>Uma curta animada de fã, no universo de Bloons TD6. Cerca de 1 minuto, com som sintetizado ao vivo.</p>
  <button id="start">▶ Assistir</button>
  <a href="../../index.html#animacoes">← voltar ao menu</a>
</div>
<div class="overlay" id="outro" hidden>
  <h1>FIM</h1>
  <button id="again">↺ Assistir de novo</button>
  <a href="../../index.html#animacoes">← voltar ao menu</a>
</div>
<!-- ============================== JS ============================== -->
<script>
(function () {
  'use strict';
  // The film is drawn on a virtual 1280x720 stage that is scaled to fit the window.
  const VW = 1280, VH = 720, END = 64.5, BAR = 92;
  const TAU = Math.PI * 2;
  const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';
  const SANS = '"Helvetica Neue", Helvetica, Arial, sans-serif';
  const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123; return x - Math.floor(x); };
  const E = {
    inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    sine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
    out: (t) => 1 - Math.pow(1 - t, 3),
    back: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    elastic: (t) => (t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1),
  };

  // ------------------------------------------------------------------ script
  const SUBS = [
    [5.6, 8.0, 'CENTRAL', 'Falcão, aqui é a Central. Na escuta?'],
    [8.1, 10.0, 'FALCÃO', 'Em posição. Telhado leste.'],
    [10.4, 13.0, 'CENTRAL', 'O alvo cruzou a Trilha 7 há vinte minutos.'],
    [13.0, 15.4, 'CENTRAL', 'Passou por três Dart Monkeys. Nem um arranhão.'],
    [16.0, 19.8, 'FALCÃO', 'Sem contato visual. Só chuva... e janelas.'],
    [20.3, 22.6, 'CENTRAL', 'Fique atento. Ele é vermelho.'],
    [22.6, 24.9, 'CENTRAL', 'Rápido. Silencioso. Cheio de ar.'],
    [25.3, 27.4, 'FALCÃO', 'Distância: dois quilômetros.'],
    [27.4, 29.4, 'FALCÃO', 'Vento: quatro nós a leste.'],
    [29.8, 32.2, 'CENTRAL', 'Você só tem um tiro, Falcão.'],
    [32.2, 34.9, 'CENTRAL', 'Se ele chegar ao fim da trilha... perdemos uma vida.'],
    [35.4, 37.6, 'FALCÃO', '...Contato. Alvo vermelho, terceiro andar.'],
    [38.0, 39.8, 'CENTRAL', 'Autorizado. Agora.'],
    [48.0, 50.8, 'CRIANÇA', '...meu balão.'],
    [51.5, 53.8, 'CENTRAL', '...Falcão. Aquilo era um balão de festa.'],
    [56.0, 57.9, 'FALCÃO', '...Ele era vermelho.'],
    [58.0, 59.6, 'CENTRAL', 'Volte pra base.'],
  ];
  const SUB_COLORS = { CENTRAL: '#7dffb0', FALCÃO: '#ffd166', CRIANÇA: '#ff9ec7' };
  const CPS = 32;
  function talking(who, T) {
    for (const s of SUBS) if (s[2] === who && T >= s[0] && T < Math.min(s[1], s[0] + s[3].length / CPS + 0.15)) return 0.5 + 0.5 * Math.sin(T * 24);
    return 0;
  }

  // ------------------------------------------------------------------ drawing helpers
  const OL = '#24150b', FUR = '#8b5a2b', FUR_D = '#6b4220', FACE = '#f0c99a', FACE_D = '#d9a874';
  const ell = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), rot, 0, TAU); };
  const circ = (c, x, y, r) => { c.beginPath(); c.arc(x, y, Math.max(0.01, r), 0, TAU); };
  function rrect(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r); c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h); c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r); c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y); c.closePath();
  }
  function camo(c, n, x, y, w, h, seed) {
    const cols = ['#3a4720', '#6b7a3a', '#2c3618'];
    for (let i = 0; i < n; i++) { c.fillStyle = cols[i % 3]; ell(c, x + hash(seed + i) * w, y + hash(seed + i * 2.7) * h, 8 + hash(i + seed * 3) * 18, 5 + hash(i + seed) * 10, hash(i * 9 + seed) * 3); c.fill(); }
  }

  // Front-facing monkey head, centred on (o.x, o.y). Unit radius is about 88.
  function monkeyHead(c, o) {
    c.save(); c.translate(o.x, o.y); c.rotate(o.rot || 0); c.scale(o.s, o.s);
    c.lineWidth = 5; c.strokeStyle = OL; c.lineJoin = 'round'; c.lineCap = 'round';
    for (const sx of [-1, 1]) { ell(c, sx * 88, 8, 30, 32); c.fillStyle = FUR; c.fill(); c.stroke(); ell(c, sx * 88, 8, 17, 19); c.fillStyle = FACE_D; c.fill(); }
    ell(c, 0, 0, 88, 84); c.fillStyle = FUR; c.fill(); c.stroke();
    c.fillStyle = FACE; ell(c, -28, -6, 34, 36); c.fill(); ell(c, 28, -6, 34, 36); c.fill(); ell(c, 0, 36, 50, 36); c.fill();
    for (const sx of [-1, 1]) eye(c, sx * 27, -6, o);
    if (o.brow !== undefined) {
      c.strokeStyle = FUR_D; c.lineWidth = 8;
      for (const sx of [-1, 1]) { c.beginPath(); c.moveTo(sx * 46, -42 - o.brow * 4); c.lineTo(sx * 12, -38 + o.brow * 8); c.stroke(); }
      c.strokeStyle = OL; c.lineWidth = 5;
    }
    c.fillStyle = '#5a3418'; ell(c, -8, 22, 5, 3.5); c.fill(); ell(c, 8, 22, 5, 3.5); c.fill();
    mouth(c, o);
    if (o.sweat !== undefined) {
      const y = -30 + o.sweat * 60;
      c.fillStyle = 'rgba(190, 230, 255, 0.9)'; c.beginPath(); c.moveTo(66, y - 14); c.quadraticCurveTo(76, y + 2, 66, y + 6); c.quadraticCurveTo(56, y + 2, 66, y - 14); c.fill();
      c.fillStyle = '#fff'; circ(c, 63, y, 2); c.fill();
    }
    if (o.tear) { c.fillStyle = 'rgba(150, 210, 255, 0.95)'; ell(c, -27, 14 + o.tear * 4, 6 + o.tear * 4, 4 + o.tear * 6); c.fill(); ell(c, 27, 14 + o.tear * 4, 6 + o.tear * 4, 4 + o.tear * 6); c.fill(); }
    if (o.helmet) helmet(c);
    if (o.glasses !== undefined) glasses(c, o.glasses, o.reflect);
    if (o.headset) headset(c);
    if (o.hat) partyHat(c, o.hat);
    c.restore();
  }
  function eye(c, x, y, o) {
    const lx = (o.lookX || 0) * 7, ly = (o.lookY || 0) * 6, lid = clamp(o.lid || 0);
    if (o.wide) {
      c.fillStyle = '#fff'; ell(c, x, y, 17, 20); c.fill(); c.lineWidth = 3; c.stroke(); c.lineWidth = 5;
      c.fillStyle = '#111'; circ(c, x + lx * 0.7, y + ly * 0.7, 5); c.fill();
    } else {
      c.fillStyle = '#111'; ell(c, x + lx, y + ly, 11, 15); c.fill();
      c.fillStyle = '#fff'; circ(c, x + lx - 4, y + ly - 6, 4); c.fill();
    }
    if (lid > 0) {
      c.save(); ell(c, x, y, 20, 22); c.clip();
      c.fillStyle = FACE; c.fillRect(x - 22, y - 23, 44, 44 * lid);
      c.strokeStyle = '#7a4a22'; c.lineWidth = 4; c.beginPath(); c.moveTo(x - 18, y - 23 + 44 * lid); c.lineTo(x + 18, y - 23 + 44 * lid); c.stroke();
      c.restore();
    }
  }
  function mouth(c, o) {
    c.strokeStyle = OL; c.lineWidth = 4;
    const m = o.mouth || 'flat', talk = o.talk || 0;
    if (talk > 0.05) { c.fillStyle = '#4a1d12'; ell(c, 0, 46, 10, 2 + talk * 8); c.fill(); return; }
    c.beginPath();
    if (m === 'flat') { c.moveTo(-14, 46); c.lineTo(14, 46); c.stroke(); }
    else if (m === 'smile') { c.arc(0, 32, 20, 0.2 * Math.PI, 0.8 * Math.PI); c.stroke(); }
    else if (m === 'grin') { c.arc(0, 36, 22, 0.1 * Math.PI, 0.9 * Math.PI); c.closePath(); c.fillStyle = '#4a1d12'; c.fill(); c.stroke(); c.fillStyle = '#e46b6b'; ell(c, 0, 52, 9, 4); c.fill(); }
    else if (m === 'o') { c.fillStyle = '#4a1d12'; ell(c, 0, 48, 8, 11); c.fill(); }
    else if (m === 'frown') { c.arc(0, 62, 16, 1.2 * Math.PI, 1.8 * Math.PI); c.stroke(); }
    else if (m === 'wobble') { const ph = o.wt || 0; c.moveTo(-16, 50); for (let i = 1; i <= 8; i++) c.lineTo(-16 + i * 4, 50 + Math.sin(i * 1.7 + ph * 30) * 2.5 - Math.sin((i / 8) * Math.PI) * 4); c.stroke(); }
  }
  function helmet(c) {
    c.save();
    c.beginPath(); c.ellipse(0, -24, 102, 86, 0, Math.PI, TAU); c.closePath();
    c.fillStyle = '#4b5b2a'; c.fill(); c.stroke(); c.clip(); camo(c, 14, -100, -110, 200, 90, 3);
    c.restore();
    rrect(c, -110, -32, 220, 16, 7); c.fillStyle = '#3e4b22'; c.fill(); c.stroke();
    c.strokeStyle = 'rgba(20, 25, 10, 0.5)'; c.lineWidth = 2;
    for (let i = -3; i <= 3; i++) { c.beginPath(); c.moveTo(i * 26, -34); c.lineTo(i * 30, -100 + Math.abs(i) * 8); c.stroke(); }
    c.strokeStyle = OL; c.lineWidth = 5;
  }
  function glasses(c, slide, reflect) {
    const dy = slide * 34;
    c.lineWidth = 4; c.strokeStyle = '#000';
    c.beginPath(); c.moveTo(-54, -10 + dy); c.lineTo(-86, -2); c.moveTo(54, -10 + dy); c.lineTo(86, -2); c.stroke();
    for (const sx of [-1, 1]) {
      rrect(c, sx * 28 - 27, -24 + dy, 54, 36, 11); c.fillStyle = '#0a0a0c'; c.fill(); c.stroke();
      c.save(); rrect(c, sx * 28 - 27, -24 + dy, 54, 36, 11); c.clip();
      if (reflect) reflect(c, sx * 28, -6 + dy, sx);
      c.strokeStyle = 'rgba(255, 255, 255, 0.28)'; c.lineWidth = 6; c.beginPath(); c.moveTo(sx * 28 - 14, 10 + dy); c.lineTo(sx * 28 + 6, -22 + dy); c.stroke();
      c.restore();
    }
    c.beginPath(); c.moveTo(-2, -12 + dy); c.quadraticCurveTo(0, -18 + dy, 2, -12 + dy); c.stroke();
    c.lineWidth = 5; c.strokeStyle = OL;
  }
  function headset(c) {
    c.fillStyle = '#111'; circ(c, 90, 8, 13); c.fill();
    c.strokeStyle = '#111'; c.lineWidth = 4; c.beginPath(); c.moveTo(84, 18); c.quadraticCurveTo(70, 52, 34, 54); c.stroke();
    c.fillStyle = '#222'; circ(c, 32, 54, 6); c.fill();
    c.strokeStyle = '#333'; c.lineWidth = 2; c.beginPath(); c.moveTo(92, 20);
    for (let i = 0; i < 12; i++) c.lineTo(94 + (i % 2 ? 5 : -5), 26 + i * 7);
    c.stroke(); c.strokeStyle = OL; c.lineWidth = 5;
  }
  function partyHat(c, col) {
    c.save(); c.translate(14, -76); c.rotate(0.18);
    c.beginPath(); c.moveTo(-36, 0); c.lineTo(36, 0); c.lineTo(0, -96); c.closePath(); c.fillStyle = col[0]; c.fill(); c.save(); c.clip();
    c.fillStyle = col[1]; for (let i = 0; i < 4; i++) c.fillRect(-40, -18 - i * 24, 80, 10);
    c.restore(); c.stroke(); c.fillStyle = col[2]; circ(c, 0, -98, 11); c.fill(); c.stroke();
    c.restore();
  }
  // Side-view head facing right, used for the prone sniper.
  function monkeyProfile(c, x, y, s, o = {}) {
    c.save(); c.translate(x, y); c.scale(s, s); c.lineWidth = 5; c.strokeStyle = OL; c.lineJoin = 'round';
    ell(c, -40, 4, 20, 24); c.fillStyle = FUR; c.fill(); c.stroke(); ell(c, -40, 4, 11, 14); c.fillStyle = FACE_D; c.fill();
    circ(c, 0, 0, 62); c.fillStyle = FUR; c.fill(); c.stroke();
    ell(c, 28, -4, 34, 32); c.fillStyle = FACE; c.fill();
    ell(c, 50, 22, 32, 24); c.fill(); c.stroke();
    c.fillStyle = '#111'; ell(c, 40, -8, 6, (o.lid ? 2 : 9)); c.fill();
    c.fillStyle = '#5a3418'; circ(c, 78, 14, 4); c.fill();
    c.beginPath(); c.moveTo(56, 34); c.lineTo(70, 32 - (o.talk || 0) * 6); c.stroke();
    c.save(); c.beginPath(); c.ellipse(0, -14, 72, 60, 0, Math.PI, TAU); c.closePath(); c.fillStyle = '#4b5b2a'; c.fill(); c.stroke(); c.clip(); camo(c, 8, -70, -76, 140, 64, 11); c.restore();
    rrect(c, -76, -20, 160, 12, 6); c.fillStyle = '#3e4b22'; c.fill(); c.stroke();
    c.restore();
  }
  function rifle(c, x, y, s, flash) {
    c.save(); c.translate(x, y); c.scale(s, s); c.lineWidth = 4; c.strokeStyle = '#0d0d0f'; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(-120, -6); c.lineTo(10, -22); c.lineTo(30, 4); c.lineTo(-100, 22); c.closePath(); c.fillStyle = '#5a3a1e'; c.fill(); c.stroke();
    rrect(c, 10, -26, 150, 22, 5); c.fillStyle = '#2b2f33'; c.fill(); c.stroke();
    c.fillStyle = '#1d2023'; c.fillRect(160, -21, 380, 9); c.strokeRect(160, -21, 380, 9);
    rrect(c, 500, -25, 70, 17, 4); c.fillStyle = '#16181b'; c.fill(); c.stroke();
    c.fillStyle = '#3a3f45'; c.fillRect(60, -38, 12, 14); c.fillRect(130, -38, 12, 14);
    rrect(c, 34, -58, 140, 22, 10); c.fillStyle = '#1b1d20'; c.fill(); c.stroke();
    rrect(c, 160, -62, 26, 30, 8); c.fill(); c.stroke();
    c.fillStyle = '#9fd8ff'; ell(c, 184, -47, 4, 11); c.fill();
    c.strokeStyle = '#2b2f33'; c.lineWidth = 5; c.beginPath(); c.moveTo(440, -12); c.lineTo(420, 60); c.moveTo(440, -12); c.lineTo(466, 60); c.stroke();
    c.strokeStyle = 'rgba(255, 255, 255, 0.12)'; c.lineWidth = 2; c.beginPath(); c.moveTo(165, -19); c.lineTo(535, -19); c.stroke();
    if (flash > 0) {
      c.save(); c.translate(575, -16); c.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * TAU, L = (i % 2 ? 60 : 160) * flash * (i === 0 ? 1.8 : 1);
        c.fillStyle = `rgba(255, ${190 + (i % 3) * 20}, 90, ${0.8 * flash})`;
        c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a - 0.12) * L * 0.3, Math.sin(a - 0.12) * L * 0.3); c.lineTo(Math.cos(a) * L, Math.sin(a) * L); c.lineTo(Math.cos(a + 0.12) * L * 0.3, Math.sin(a + 0.12) * L * 0.3); c.fill();
      }
      const g = c.createRadialGradient(0, 0, 0, 0, 0, 140 * flash); g.addColorStop(0, `rgba(255, 255, 230, ${flash})`); g.addColorStop(1, 'rgba(255, 160, 60, 0)');
      c.fillStyle = g; circ(c, 0, 0, 140 * flash); c.fill(); c.restore();
    }
    c.restore();
  }
  function bloon(c, x, y, s, opts = {}) {
    c.save(); c.translate(x, y); c.scale(s, s); c.rotate(opts.rot || 0);
    if (opts.string) {
      c.strokeStyle = '#f4f4f4'; c.lineWidth = 2; c.beginPath(); c.moveTo(0, 62);
      for (let i = 1; i <= 10; i++) c.lineTo(Math.sin(i * 0.9 + (opts.wave || 0)) * 8, 62 + i * opts.string / 10);
      c.stroke();
    }
    c.strokeStyle = '#4a0a0a'; c.lineWidth = 5;
    c.fillStyle = '#c8191e'; c.beginPath(); c.moveTo(-8, 66); c.lineTo(8, 66); c.lineTo(0, 54); c.closePath(); c.fill(); c.stroke();
    ell(c, 0, 0, 48, 58); c.fillStyle = opts.color || '#e3242b'; c.fill(); c.stroke();
    c.fillStyle = 'rgba(255, 255, 255, 0.75)'; ell(c, -18, -26, 10, 17, 0.5); c.fill();
    c.fillStyle = 'rgba(255, 255, 255, 0.4)'; circ(c, -6, -42, 4); c.fill();
    c.fillStyle = 'rgba(80, 0, 0, 0.18)'; ell(c, 14, 14, 26, 36, 0.4); c.fill();
    c.restore();
  }

  // Pre-rendered city skyline layers (drawn once, reused by several shots).
  const SKY = [];
  function buildSkyline() {
    const specs = [
      { h: [220, 420], col: '#1a2238', win: 0.22, seed: 1, top: 720 },
      { h: [160, 330], col: '#121a2c', win: 0.3, seed: 2, top: 720 },
      { h: [90, 220], col: '#0a0f1c', win: 0.38, seed: 3, top: 720 },
    ];
    for (const sp of specs) {
      const cnv = document.createElement('canvas'); cnv.width = 2600; cnv.height = 720;
      const c = cnv.getContext('2d');
      let x = 0, i = 0;
      while (x < 2600) {
        const bw = 60 + hash(sp.seed * 100 + i) * 110, bh = lerp(sp.h[0], sp.h[1], hash(sp.seed * 200 + i * 1.3));
        c.fillStyle = sp.col; c.fillRect(x, 720 - bh, bw - 4, bh);
        for (let wy = 720 - bh + 12; wy < 712; wy += 18) for (let wx = x + 8; wx < x + bw - 16; wx += 14) {
          const r = hash(wx * 0.37 + wy * 1.91 + sp.seed);
          if (r < sp.win) { c.fillStyle = r < sp.win * 0.15 ? '#9fd8ff' : `rgba(255, 210, 130, ${0.35 + r})`; c.fillRect(wx, wy, 7, 9); }
        }
        if (hash(i + sp.seed * 7) > 0.7) { c.fillStyle = sp.col; c.fillRect(x + bw / 2 - 2, 720 - bh - 40, 4, 40); c.fillStyle = '#ff3b3b'; c.fillRect(x + bw / 2 - 3, 720 - bh - 44, 6, 6); }
        x += bw; i++;
      }
      SKY.push(cnv);
    }
  }
  buildSkyline();

  function nightSky(c, top = '#04060d', bottom = '#1c2541') {
    const g = c.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, top); g.addColorStop(1, bottom);
    c.fillStyle = g; c.fillRect(-200, -200, VW + 400, VH + 400);
  }
  function bokeh(c, T, n = 40, seed = 0, alpha = 0.35) {
    for (let i = 0; i < n; i++) {
      const x = hash(i * 3.1 + seed) * VW, y = 120 + hash(i * 1.7 + seed) * 500, r = 6 + hash(i * 9.3 + seed) * 22;
      const warm = hash(i + seed * 5) > 0.35;
      c.fillStyle = warm ? `rgba(255, 190, 110, ${alpha * (0.4 + 0.6 * hash(i * 2.2))})` : `rgba(120, 190, 255, ${alpha * 0.6})`;
      circ(c, x + Math.sin(T * 0.3 + i) * 4, y, r); c.fill();
    }
  }
  function rain(c, T, n, alpha, angle = 0.18, frozen = false) {
    c.save(); c.strokeStyle = `rgba(190, 210, 235, ${alpha})`; c.lineWidth = 1.5;
    c.beginPath();
    for (let i = 0; i < n; i++) {
      const sp = frozen ? 8 : 1100 + hash(i * 1.3) * 700, len = frozen ? 6 : 26 + hash(i) * 30;
      const y = ((hash(i * 7.7) * 900 + T * sp) % 900) - 90, x = hash(i * 3.1) * (VW + 300) - 150 + y * angle;
      c.moveTo(x, y); c.lineTo(x - len * angle, y - len);
    }
    c.stroke(); c.restore();
  }
  function lightning(T) {
    let a = 0;

  }
  function vignette(c, k = 0.75) {
    const g = c.createRadialGradient(VW / 2, VH / 2, VH * 0.35, VW / 2, VH / 2, VW * 0.72);
    g.addColorStop(0, 'rgba(0, 0, 0, 0)'); g.addColorStop(1, `rgba(0, 0, 0, ${k})`);

  }
  function camera(c, fx, fy, zoom, rot = 0, shake = 0, T = 0) {
    c.translate(VW / 2 + (shake ? (hash(Math.floor(T * 60)) - 0.5) * shake : 0), VH / 2 + (shake ? (hash(Math.floor(T * 60) + 0.5) - 0.5) * shake : 0));
    c.rotate(rot); c.scale(zoom, zoom); c.translate(-fx, -fy);
  }

  // ------------------------------------------------------------------ office set (Central)
  function office(c, T, opts = {}) {
    c.fillStyle = '#0b1310'; c.fillRect(-200, -200, VW + 400, VH + 400);
    // Window with blinds and rain behind it.
    c.save(); c.beginPath(); c.rect(70, 70, 330, 400); c.clip();
    nightSky(c, '#05080f', '#141c30'); c.drawImage(SKY[1], 900, 300, 1000, 280, 70, 230, 1000, 280);
    const fl = lightning(T); if (fl > 0) { c.fillStyle = `rgba(220, 230, 255, ${fl * 0.7})`; c.fillRect(70, 70, 330, 400); }
    rain(c, T, 60, 0.35);
    c.fillStyle = 'rgba(20, 28, 24, 0.86)';
    for (let y = 70; y < 470; y += 26) c.fillRect(70, y, 330, 13);
    c.restore();
    c.strokeStyle = '#1f2a24'; c.lineWidth = 10; c.strokeRect(70, 70, 330, 400);
    // Wall of monitors.
    const mons = [[480, 60], [700, 60], [920, 60], [480, 230], [700, 230], [920, 230]];
    mons.forEach(([x, y], i) => monitor(c, x, y, 200, 150, i, T, opts.alarm));
    if (opts.alarm) {
      c.save(); c.globalCompositeOperation = 'lighter';
      const a = T * 3, g = c.createRadialGradient(640, 0, 0, 640, 0, 900);
      g.addColorStop(0, 'rgba(255, 30, 30, 0.35)'); g.addColorStop(1, 'rgba(255, 0, 0, 0)');
      c.fillStyle = g; c.beginPath(); c.moveTo(640, 0); c.arc(640, 0, 900, a, a + 0.5); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(640, 0); c.arc(640, 0, 900, a + Math.PI, a + Math.PI + 0.5); c.closePath(); c.fill();
      c.restore();
      c.fillStyle = '#300'; c.fillRect(620, 0, 40, 18); c.fillStyle = `rgba(255, 40, 40, ${0.6 + 0.4 * Math.sin(T * 12)})`; c.fillRect(626, 4, 28, 12);
    }
    // Green glow from the screens.
    const g = c.createRadialGradient(760, 220, 40, 760, 220, 700);
    g.addColorStop(0, 'rgba(60, 255, 150, 0.14)'); g.addColorStop(1, 'rgba(0, 0, 0, 0)');
    c.fillStyle = g; c.fillRect(-200, -200, VW + 400, VH + 400);
  }
  function monitor(c, x, y, w, h, i, T, alarm) {
    c.fillStyle = '#050807'; rrect(c, x - 8, y - 8, w + 16, h + 16, 6); c.fill();
    c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip();
    c.fillStyle = '#082418'; c.fillRect(x, y, w, h);
    const glow = 'rgba(90, 255, 160, 0.85)';
    if (i === 0 || i === 4) {
      // Track map: grass, winding path, a red dot creeping along it.
      c.fillStyle = '#0f4a26'; c.fillRect(x, y, w, h);
      const path = (k) => [x + 10 + k * (w - 20), y + h / 2 + Math.sin(k * 9) * h * 0.3];
      c.strokeStyle = '#c9b27a'; c.lineWidth = 12; c.beginPath();
      for (let k = 0; k <= 1.001; k += 0.02) { const [px, py] = path(k); k ? c.lineTo(px, py) : c.moveTo(px, py); }
      c.stroke();
      const [bx, by] = path(((T * 0.02) % 0.9) + 0.05);
      if (Math.sin(T * 8) > -0.3) { c.fillStyle = '#ff2b2b'; circ(c, bx, by, 7); c.fill(); }
      c.fillStyle = glow; c.font = `700 12px ${MONO}`; c.fillText(i ? 'TRILHA 7' : 'ALVO: VERMELHO', x + 8, y + 16);
    } else if (i === 1 || i === 5) {
      const cx = x + w / 2, cy = y + h / 2, r = h * 0.42;
      c.strokeStyle = 'rgba(90, 255, 160, 0.4)'; c.lineWidth = 1;
      for (let k = 1; k <= 3; k++) { circ(c, cx, cy, (r * k) / 3); c.stroke(); }
      c.beginPath(); c.moveTo(cx - r, cy); c.lineTo(cx + r, cy); c.moveTo(cx, cy - r); c.lineTo(cx, cy + r); c.stroke();
      const a = T * 2.2 + i;
      c.fillStyle = 'rgba(90, 255, 160, 0.25)'; c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, r, a - 0.6, a); c.closePath(); c.fill();
      c.fillStyle = alarm ? '#ff3030' : '#ff5050'; circ(c, cx + r * 0.45, cy - r * 0.3, 4); c.fill();
    } else {
      c.fillStyle = glow; c.font = `600 11px ${MONO}`;
      const lines = ['> RASTREANDO...', '> BLOON CLASSE: RED', '> VEL: 1.0x', '> CAMADAS: 1', '> STATUS: ATIVO', '> DART MONKEY x3: FALHA', '> SNIPER: FALCÃO', '> VENTO: 4kn L'];
      const off = Math.floor(T * 2 + i * 3);
      for (let k = 0; k < 8; k++) c.fillText(lines[(k + off) % lines.length], x + 8, y + 18 + k * 16);
      if (i === 3 && Math.sin(T * 5) > 0) { c.fillStyle = 'rgba(255, 60, 60, 0.9)'; c.fillText('█ ALERTA', x + 120, y + 18); }
    }
    for (let sy = y; sy < y + h; sy += 3) { c.fillStyle = 'rgba(0, 0, 0, 0.18)'; c.fillRect(x, sy, w, 1); }
    c.restore();
  }
  function agentBody(c, x, y, s) {
    c.save(); c.translate(x, y); c.scale(s, s); c.lineWidth = 5; c.strokeStyle = '#000'; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(-190, 420); c.lineTo(-170, 150); c.quadraticCurveTo(-150, 90, -60, 80); c.lineTo(60, 80); c.quadraticCurveTo(150, 90, 170, 150); c.lineTo(190, 420); c.closePath();

    c.beginPath(); c.moveTo(-50, 80); c.lineTo(50, 80); c.lineTo(0, 210); c.closePath(); c.fillStyle = '#e8e8e8'; c.fill();
    c.beginPath(); c.moveTo(-10, 92); c.lineTo(10, 92); c.lineTo(16, 190); c.lineTo(0, 214); c.lineTo(-16, 190); c.closePath(); c.fillStyle = '#060606'; c.fill();
    c.strokeStyle = '#2a2a2e'; c.lineWidth = 4; c.beginPath(); c.moveTo(-50, 80); c.lineTo(-80, 200); c.lineTo(-20, 260); c.moveTo(50, 80); c.lineTo(80, 200); c.lineTo(20, 260); c.stroke();
    c.restore();
  }
  function desk(c, T) {
    c.fillStyle = '#121a16'; c.fillRect(-200, 580, VW + 400, 300);
    c.fillStyle = '#1c2822'; c.fillRect(-200, 572, VW + 400, 14);
    rrect(c, 760, 520, 60, 62, 8); c.fillStyle = '#d8d4c8'; c.fill();
    c.fillStyle = '#7a1c1c'; c.font = `800 13px ${SANS}`; c.fillText('#1', 778, 556);
    c.strokeStyle = 'rgba(220, 220, 220, 0.22)'; c.lineWidth = 3;
    for (let k = 0; k < 2; k++) { c.beginPath(); c.moveTo(782 + k * 14, 512); for (let i = 1; i < 8; i++) c.lineTo(782 + k * 14 + Math.sin(T * 2 + i * 0.8 + k) * 7, 512 - i * 12); c.stroke(); }
  }

  // ------------------------------------------------------------------ scope set
  const TARGET = { x: 1800, y: 900 };
  function facade(c, T, party) {
    c.fillStyle = '#141b2a'; c.fillRect(-400, -400, 3600, 2800);
    for (let fy = 0; fy < 16; fy++) for (let fx = 0; fx < 26; fx++) {
      const x = fx * 120, y = fy * 150;
      c.fillStyle = '#0d1320'; c.fillRect(x + 4, y + 132, 112, 10);
      const wx = x + 24, wy = y + 30, ww = 72, wh = 90, r = hash(fx * 13.1 + fy * 7.7);
      if (x + 24 === TARGET.x - 36 && y + 30 === TARGET.y - 45) continue;
      c.fillStyle = r < 0.35 ? '#e8c27a' : r < 0.45 ? '#7fb4d9' : '#0a0e17'; c.fillRect(wx, wy, ww, wh);
      if (r < 0.35 && hash(r * 99) > 0.6) { c.fillStyle = '#3a2a18'; circ(c, wx + 30 + Math.sin(T + r * 20) * 6, wy + 60, 18); c.fill(); c.fillRect(wx + 12, wy + 70, 36, 20); }
      if (r < 0.45 && r >= 0.35 && hash(r * 77) > 0.5) { c.fillStyle = '#20384a'; c.fillRect(wx + 44, wy + 52, 18, 38); circ(c, wx + 53, wy + 48, 14); c.fill(); }
      c.strokeStyle = '#05070c'; c.lineWidth = 4; c.strokeRect(wx, wy, ww, wh); c.beginPath(); c.moveTo(wx + ww / 2, wy); c.lineTo(wx + ww / 2, wy + wh); c.stroke();
    }
    // The target window: warm pink light, a garland hint and the red shape bobbing.
    const wx = TARGET.x - 36, wy = TARGET.y - 45;
    c.fillStyle = '#ffb3c8'; c.fillRect(wx, wy, 72, 90);
    c.fillStyle = '#ff7aa8'; c.fillRect(wx, wy, 72, 6);
    if (party) for (let k = 0; k < 6; k++) { c.fillStyle = ['#ffd166', '#5ff0c8', '#7aa8ff'][k % 3]; c.beginPath(); c.moveTo(wx + k * 12, wy + 6); c.lineTo(wx + k * 12 + 12, wy + 6); c.lineTo(wx + k * 12 + 6, wy + 16); c.fill(); }
    bloon(c, TARGET.x + Math.sin(T * 1.3) * 3, TARGET.y + Math.sin(T * 2.1) * 4, 0.42, { string: 60, wave: T });
    c.fillStyle = 'rgba(120, 40, 60, 0.55)'; c.fillRect(wx, wy, 14, 90); c.fillRect(wx + 58, wy, 14, 90);
    c.strokeStyle = '#05070c'; c.lineWidth = 4; c.strokeRect(wx, wy, 72, 90);
  }
  function scopeView(c, T, cx, cy, zoom, party, opts = {}) {
    const R = 300;
    c.save(); circ(c, 640, 360, R); c.clip();
    c.save(); c.translate(640, 360); c.scale(zoom, zoom); c.translate(-cx, -cy); facade(c, T, party); c.restore();
    rain(c, T, 30, 0.18);
    c.fillStyle = 'rgba(40, 255, 140, 0.07)'; c.fillRect(0, 0, VW, VH);
    const g = c.createRadialGradient(640, 360, R * 0.55, 640, 360, R); g.addColorStop(0, 'rgba(0, 0, 0, 0)'); g.addColorStop(1, `rgba(0, 0, 0, ${0.85 + (opts.pulse || 0) * 0.15})`);
    c.fillStyle = g; c.fillRect(0, 0, VW, VH);
    for (let i = 0; i < 6; i++) {
      const x = 640 + (hash(i * 5.3) - 0.5) * R * 1.4, y = 360 + (hash(i * 2.9) - 0.5) * R * 1.4;
      c.fillStyle = 'rgba(200, 230, 255, 0.12)'; circ(c, x, y, 6 + hash(i) * 10); c.fill();
      c.fillStyle = 'rgba(255, 255, 255, 0.35)'; circ(c, x - 3, y - 3, 2); c.fill();
    }
    c.restore();
    c.fillStyle = '#000'; c.beginPath(); c.rect(-10, -10, VW + 20, VH + 20); c.arc(640, 360, R, 0, TAU, true); c.fill('evenodd');
    c.strokeStyle = '#111'; c.lineWidth = 14; circ(c, 640, 360, R + 6); c.stroke();
    c.strokeStyle = 'rgba(0, 0, 0, 0.9)'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(640 - R, 360); c.lineTo(640 + R, 360); c.moveTo(640, 360 - R); c.lineTo(640, 360 + R); c.stroke();
    c.lineWidth = 7; c.beginPath(); c.moveTo(640 - R, 360); c.lineTo(640 - 110, 360); c.moveTo(640 + 110, 360); c.lineTo(640 + R, 360); c.moveTo(640, 360 + 110); c.lineTo(640, 360 + R); c.stroke();
    c.fillStyle = '#000'; for (let k = -4; k <= 4; k++) if (k) { circ(c, 640 + k * 22, 360, 2.5); c.fill(); circ(c, 640, 360 + k * 22, 2.5); c.fill(); }
    c.strokeStyle = opts.locked ? 'rgba(255, 50, 50, 0.9)' : 'rgba(255, 50, 50, 0.5)'; c.lineWidth = 2; circ(c, 640, 360, 4); c.stroke();
    c.fillStyle = '#7dffb0'; c.font = `600 18px ${MONO}`; c.textAlign = 'left';
    c.fillText('DIST  2.000 m', 990, 520); c.fillText('VENTO 4 kn ←', 990, 548);
    c.fillText(`ZOOM  ${(zoom * 6).toFixed(1)}x`, 990, 576);
    if (opts.locked && Math.sin(T * 10) > -0.2) { c.fillStyle = '#ff4040'; c.fillText('◉ ALVO: VERMELHO', 990, 492); }
  }

  // ------------------------------------------------------------------ shots
  // Each shot draws itself for local time lt (seconds since the cut) at film time T.
  function shotCity(c, lt, T) {
    const z = 1 + 0.32 * E.sine(seg(lt, 0, 5));
    c.save(); camera(c, lerp(640, 900, E.sine(seg(lt, 0, 5))), lerp(360, 430, E.sine(seg(lt, 0, 5))), z);
    nightSky(c);
    c.fillStyle = 'rgba(220, 225, 240, 0.85)'; circ(c, 1060, 130, 34); c.fill();
    c.fillStyle = 'rgba(28, 36, 60, 0.85)'; for (let i = 0; i < 4; i++) { ell(c, 960 + i * 70 + lt * 8, 140 + (i % 2) * 18, 90, 22); c.fill(); }
    c.drawImage(SKY[0], 300 + lt * 6, 0, 1600, 720, -120, 20, 1600, 720);
    c.drawImage(SKY[1], 600 + lt * 12, 0, 1600, 720, -120, 80, 1600, 720);

    c.fillStyle = '#070b14'; c.fillRect(780, 440, 400, 400); c.fillRect(1040, 400, 40, 40);
    c.fillStyle = '#05070c'; ell(c, 930, 436, 46, 9); c.fill(); circ(c, 980, 428, 10); c.fill();
    c.fillRect(980, 428, 90, 4); c.fillRect(1000, 422, 24, 6);
    c.fillStyle = 'rgba(255, 210, 130, 0.5)'; for (let i = 0; i < 18; i++) if (hash(i * 4.1) > 0.4) c.fillRect(800 + (i % 6) * 60, 480 + Math.floor(i / 6) * 60, 18, 24);
    const fog = c.createLinearGradient(0, 500, 0, 760); fog.addColorStop(0, 'rgba(30, 40, 70, 0)'); fog.addColorStop(1, 'rgba(30, 40, 70, 0.7)');
    c.fillStyle = fog; c.fillRect(-200, 500, VW + 400, 400);
    c.restore();
    const fl = lightning(T); if (fl) { c.fillStyle = `rgba(210, 220, 255, ${fl * 0.45})`; c.fillRect(0, 0, VW, VH); }
    rain(c, T, 220, 0.32);
    const a = seg(lt, 0.6, 1.1) * (1 - seg(lt, 4.2, 4.8));
    if (a > 0) {
      c.globalAlpha = a; c.fillStyle = '#e8e2d4'; c.font = `600 22px ${MONO}`; c.textAlign = 'left';
      const l1 = 'MONKEY CITY — 23:47', l2 = 'OPERAÇÃO: VERMELHO';
      c.fillText(l1.slice(0, Math.floor((lt - 0.6) * 24)), 70, BAR + 54);
      c.fillStyle = '#e3342f'; c.fillText(l2.slice(0, Math.max(0, Math.floor((lt - 1.6) * 24))), 70, BAR + 84);
      c.globalAlpha = 1;
    }
  }
  function shotSniperSide(c, lt, T) {

  function shotAgent(c, lt, T, mode) {

    c.font = `900 120px ${SANS}`; c.fillStyle = '#e8e2d4'; c.fillText('FIM', 0, 0); c.restore();
    c.font = `500 24px ${MONO}`;
    c.globalAlpha = seg(lt, 1.0, 1.5); c.fillStyle = '#a59e90'; c.fillText('Nenhum bloon foi estourado durante as filmagens.', 640, 410);
    c.globalAlpha = seg(lt, 2.2, 2.7); c.fillStyle = '#e3342f'; c.fillText('(o balão da festa não teve a mesma sorte)', 640, 450);
    c.globalAlpha = 1;
  }

  const SHOTS = [
    { t: 0, f: shotCity },
    { t: 5, f: shotSniperSide },
    { t: 10, f: (c, lt, T) => shotAgent(c, lt, T, 'serious') },
    { t: 15.5, f: (c, lt, T) => shotScope(c, lt, T, 1) },
    { t: 20, f: shotAgentGlasses },
    { t: 25, f: shotSniperClose },
    { t: 29.5, f: shotAgentDramatic },
    { t: 35, f: (c, lt, T) => shotScope(c, lt, T, 2) },
    { t: 40, f: shotTrigger },
    { t: 42, f: shotBullet },
    { t: 45.5, f: shotParty },
    { t: 51, f: (c, lt, T) => shotAgent(c, lt, T, 'funny') },
    { t: 55.5, f: shotSniperFunny },
    { t: 60, f: shotEnd },
  ];

  function render(T) {
    let si = 0;
    while (si + 1 < SHOTS.length && T >= SHOTS[si + 1].t) si++;
    const shot = SHOTS[si], lt = T - shot.t;
    ctx.save(); shot.f(ctx, lt, T); ctx.restore();
    const serious = T < 45.5;
    // Film grain, stronger in the serious half.
    ctx.fillStyle = serious ? 'rgba(255, 255, 255, 0.05)' : 'rgba(255, 255, 255, 0.025)';
    for (let i = 0; i < 140; i++) ctx.fillRect(Math.random() * VW, Math.random() * VH, 2, 2);
    // Letterbox bars open when the tone flips.
    const bh = T < 60 ? BAR * (1 - E.out(seg(T, 45.5, 46.1))) : 0;
    if (bh > 0) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, bh); ctx.fillRect(0, VH - bh, VW, bh); }
    for (const s of SUBS) {
      if (T < s[0] || T >= s[1]) continue;
      const txt = s[3].slice(0, Math.ceil((T - s[0]) * CPS)), y = VH - Math.max(bh, 24) - 34;
      ctx.font = `600 26px ${SANS}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const who = `${s[2]}: `, full = ctx.measureText(who + s[3]).width, x0 = 640 - full / 2;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)'; rrect(ctx, x0 - 16, y - 22, full + 32, 44, 8); ctx.fill();
      ctx.textAlign = 'left'; ctx.fillStyle = SUB_COLORS[s[2]]; ctx.fillText(who, x0, y);
      ctx.fillStyle = '#fff'; ctx.fillText(txt, x0 + ctx.measureText(who).width, y);
    }
    const fade = Math.max(1 - seg(T, 0, 1), seg(T, 63.5, END));
    if (fade > 0) { ctx.fillStyle = `rgba(0, 0, 0, ${fade})`; ctx.fillRect(0, 0, VW, VH); }
  }

  // ------------------------------------------------------------------ audio
  // Everything is synthesised with WebAudio and scheduled against the film clock.
  let AC = null, master = null, bus = null, NB = null, muted = false;
  function ensureAudio() {
    if (AC) return;
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(AC.destination);
      NB = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  function env(g, t, peak, a, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
  function tone(t, type, f, dur, peak, o = {}) {
    const osc = AC.createOscillator(), g = AC.createGain();
    osc.type = type; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + (o.glide || dur));
    if (o.vib) { const l = AC.createOscillator(), lg = AC.createGain(); l.frequency.value = o.vib; lg.gain.value = o.vibDepth || 6; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + dur + 0.1); }
    let node = osc;
    if (o.lp) { const f2 = AC.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.setValueAtTime(o.lp, t); if (o.lpTo) f2.frequency.exponentialRampToValueAtTime(o.lpTo, t + dur); osc.connect(f2); node = f2; }
    node.connect(g); g.connect(bus); env(g, t, peak, o.a || 0.01, dur);
    osc.start(t); osc.stop(t + dur + 0.1);
  }
  function noise(t, dur, peak, o = {}) {
    const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    src.buffer = NB; src.loop = true; f.type = o.type || 'lowpass'; f.frequency.setValueAtTime(o.f || 1000, t); f.Q.value = o.q || 0.7;
    if (o.fTo) f.frequency.exponentialRampToValueAtTime(o.fTo, t + (o.glide || dur));
    src.connect(f); f.connect(g); g.connect(bus); env(g, t, peak, o.a || 0.005, dur);
    src.start(t, Math.random()); src.stop(t + dur + 0.1);
  }
  // A long bed whose gain follows a list of [filmTime, level] points.
  function bed(base, from, t0, t1, make, levels) {
    const s = Math.max(t0, from);
    if (s >= t1) return;
    const { out, stop } = make(base + s);
    const g = AC.createGain(); out.connect(g); g.connect(bus);
    g.gain.setValueAtTime(0.0001, base + s);
    for (const [lt, v] of levels) if (lt >= s) g.gain.setTargetAtTime(Math.max(0.0001, v), base + lt, 0.08);
    g.gain.setTargetAtTime(0.0001, base + t1, 0.15);
    stop(base + t1 + 1);
  }
  function scheduleAll(base, from) {
    const at = (t) => base + t, ok = (t) => t >= from;
    bed(base, from, 0, 61, (t) => {
      const src = AC.createBufferSource(), hp = AC.createBiquadFilter(), lp = AC.createBiquadFilter();
      src.buffer = NB; src.loop = true; hp.type = 'highpass'; hp.frequency.value = 500; lp.type = 'lowpass'; lp.frequency.value = 5000;
      src.connect(hp); hp.connect(lp); src.start(t);
      return { out: lp, stop: (u) => src.stop(u) };
    }, [[0, 0.16], [5, 0.22], [10, 0.04], [15.5, 0.08], [20, 0.03], [25, 0.22], [29.5, 0.03], [35, 0.06], [40, 0.18], [42, 0.0001], [51, 0.02], [55.5, 0.03], [60, 0.0001]]);
    bed(base, from, 0, 42.5, (t) => {
      const o1 = AC.createOscillator(), o2 = AC.createOscillator(), lp = AC.createBiquadFilter();
      o1.type = 'sawtooth'; o2.type = 'sawtooth'; o1.frequency.value = 55; o2.frequency.value = 55.4; lp.type = 'lowpass'; lp.frequency.value = 180;
      o1.connect(lp); o2.connect(lp); o1.start(t); o2.start(t);
      return { out: lp, stop: (u) => { o1.stop(u); o2.stop(u); } };
    }, [[0, 0.07], [29.5, 0.11], [35, 0.13], [41.2, 0.0001]]);
    bed(base, from, 35, 41.25, (t) => {
      const o = AC.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(820, base + 41.2); o.start(t);
      return { out: o, stop: (u) => o.stop(u) };
    }, [[35, 0.0001], [38, 0.03], [40.5, 0.07], [41.2, 0.0001]]);
    for (const t of [2.4, 6.3, 27.2]) if (ok(t)) noise(at(t + 0.5), 2.6, 0.5, { f: 160, a: 0.2 });
    // Radio clicks whenever Central speaks and on Falcão's comms.
    for (const s of SUBS) if (ok(s[0]) && s[0] < 45) { noise(at(s[0] - 0.05), 0.12, 0.12, { type: 'bandpass', f: 2200, q: 2 }); noise(at(Math.min(s[1], s[0] + s[3].length / CPS + 0.1)), 0.08, 0.08, { type: 'bandpass', f: 2600, q: 2 }); }
    if (ok(29.8)) { tone(at(29.8), 'sawtooth', 49, 2.6, 0.22, { lp: 120, lpTo: 900, a: 0.15 }); tone(at(29.8), 'sawtooth', 73.5, 2.6, 0.12, { lp: 120, lpTo: 700, a: 0.15 }); }
    for (const b of [36.0, 36.9, 37.7, 38.4, 39.0, 39.5, 39.9, 40.3, 40.65, 40.95]) if (ok(b)) { tone(at(b), 'sine', 70, 0.18, 0.5, { to: 40 }); tone(at(b + 0.16), 'sine', 60, 0.16, 0.35, { to: 35 }); }
    if (ok(41.2)) {
      noise(at(41.2), 0.35, 0.9, { f: 4000, fTo: 300 }); tone(at(41.2), 'sine', 90, 0.9, 0.8, { to: 30 }); noise(at(41.25), 2.4, 0.25, { f: 700, fTo: 120, a: 0.02 });
    }
    if (ok(42)) { noise(at(42), 3.4, 0.25, { type: 'bandpass', f: 500, fTo: 140, q: 1.4, a: 0.4 }); tone(at(42), 'sine', 110, 3.4, 0.12, { to: 50, a: 0.3 }); }
    if (ok(44.6)) noise(at(44.6), 0.9, 0.18, { type: 'bandpass', f: 300, fTo: 1800, q: 1, a: 0.6 });
    // Happy birthday on a toy synth, cut short by the pop.
    const HB = [[0, 392], [0.15, 392], [0.3, 440], [0.6, 392], [0.9, 523]];
    for (const [dt, f] of HB) if (ok(45.6 + dt)) tone(at(45.6 + dt), 'square', f, 0.24, 0.07, { lp: 2400 });
    const POP = 46.6;
    if (ok(POP)) {
      noise(at(POP), 0.08, 0.9, { type: 'highpass', f: 1200 }); tone(at(POP), 'sine', 900, 0.08, 0.5, { to: 200 });
      noise(at(POP + 0.03), 0.06, 0.4, { type: 'bandpass', f: 5000, q: 3 });
      noise(at(POP + 0.25), 0.35, 0.3, { type: 'bandpass', f: 400, fTo: 3000, q: 3, glide: 0.18 });
      for (let i = 0; i < 4; i++) tone(at(POP + 0.05 + i * 0.03), 'sine', 2400 + i * 700, 0.25, 0.05);
    }
    if (ok(48.1)) tone(at(48.1), 'sine', 700, 0.9, 0.06, { to: 480, vib: 7, vibDepth: 18, a: 0.08 });
    // Sad trombone.
    [[53.9, 311, 0.42], [54.35, 294, 0.42], [54.8, 277, 0.42], [55.25, 262, 1.2]].forEach(([t, f, d], i) => {
      if (ok(t)) tone(at(t), 'sawtooth', f / 2, d, 0.16, { lp: 500, lpTo: i === 3 ? 300 : 1100, vib: i === 3 ? 6 : 0, vibDepth: 5, a: 0.05 });
    });
    // Sneaky pizzicato while the real Bloon floats by.
    const PZ = [196, 0, 233, 0, 196, 0, 175, 0, 196, 0, 233, 0, 262, 247, 233, 0];
    PZ.forEach((f, i) => { const t = 56.2 + i * 0.22; if (f && ok(t)) tone(at(t), 'triangle', f, 0.16, 0.18, { a: 0.005 }); });
    if (ok(57.5)) tone(at(57.5), 'sine', 500, 1.8, 0.04, { to: 620, vib: 3, vibDepth: 30, a: 0.3 });
    if (ok(59.3)) { tone(at(59.3), 'square', 660, 0.09, 0.08); tone(at(59.4), 'square', 440, 0.12, 0.08); }
    if (ok(60.3)) { [262, 330, 392, 523].forEach((f, i) => tone(at(60.3 + i * 0.03), 'triangle', f, 2.2, 0.06, { a: 0.05 })); }
  }

  // ------------------------------------------------------------------ clock & controls
  // The film clock follows the audio clock when audio is available, so picture and sound stay in sync.
  const nowSec = () => (AC ? AC.currentTime : performance.now() / 1000);
  let base = 0, playing = false, pausedAt = 0, started = false;
  const filmTime = () => (playing ? nowSec() - base : pausedAt);
  function startAt(from) {
    ensureAudio();
    if (AC && AC.state === 'suspended') AC.resume();
    if (bus) bus.disconnect();
    if (AC) { bus = AC.createGain(); bus.connect(master); }
    base = nowSec() + 0.05 - from;
    if (AC) scheduleAll(base, from);
    playing = true; $('outro').hidden = true; setPlayIcon();
  }
  function pause() { if (!playing) return; pausedAt = filmTime(); playing = false; if (bus) { bus.disconnect(); bus = null; } setPlayIcon(); }
  const $ = (id) => document.getElementById(id);
  const setPlayIcon = () => { $('play').textContent = playing ? '❚❚' : '▶'; };
  $('start').onclick = () => { $('intro').hidden = true; $('hud').hidden = false; started = true; startAt(0); wake(); };
  $('again').onclick = () => startAt(0);
  $('restart').onclick = () => startAt(0);
  $('play').onclick = () => (playing ? pause() : startAt(pausedAt >= END ? 0 : pausedAt));
  $('mute').onclick = () => { muted = !muted; $('mute').textContent = muted ? '🔇' : '🔊'; if (master) master.gain.value = muted ? 0 : 0.9; };
  $('bar').onclick = (e) => { const r = $('bar').getBoundingClientRect(); const t = clamp((e.clientX - r.left) / r.width) * END; if (playing) startAt(t); else pausedAt = t; };
  window.addEventListener('keydown', (e) => {
    if (!started) return;
    if (e.key === ' ') { e.preventDefault(); $('play').click(); }
    else if (e.key === 'r' || e.key === 'R') startAt(0);
    else if (e.key === 'm' || e.key === 'M') $('mute').click();
  });
  let idleTimer = 0;
  const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => playing && document.body.classList.add('idle'), 2400); };
  ['pointermove', 'pointerdown', 'keydown'].forEach((ev) => window.addEventListener(ev, wake));

  let W = 0, H = 0, DPR = 1;
  function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); }
  window.addEventListener('resize', resize);
  resize();
  const fmt = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;

  function frame() {
    let T = filmTime();
    if (playing && T >= END) { pause(); pausedAt = END; $('outro').hidden = false; }
    T = clamp(T, 0, END);
    const s = Math.min(W / VW, H / VH) * DPR;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.setTransform(s, 0, 0, s, (cv.width - VW * s) / 2, (cv.height - VH * s) / 2);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();
    render(started ? T : 3);
    ctx.restore();
    $('fill').style.width = `${(T / END) * 100}%`;
    $('time').textContent = `${fmt(T)} / ${fmt(END)}`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
