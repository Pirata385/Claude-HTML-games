<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Raio × Sangue</title>
<!-- ============================== CSS ============================== -->
<style>
:root { --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; --accent: #ffd166; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #fff; font: 600 14px var(--mono); }
canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
.overlay {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  text-align: center; padding: 24px; background: rgba(8, 8, 10, 0.82);
}
.overlay h1 { margin: 0; font: italic 900 clamp(34px, 9vw, 72px) "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0.02em; color: #efe6d2; }
.overlay h1 .v { color: #3ef0ff; }
.overlay h1 .c { color: #e01b3c; }
.overlay p { margin: 0; color: #a59e90; font-weight: 500; max-width: 480px; }
.overlay button {
  font: inherit; font-size: 16px; cursor: pointer; padding: 11px 22px; border-radius: 9px; border: 2px solid #000;
  background: #4a3a14; color: var(--accent); box-shadow: inset 0 0 0 2px rgba(255, 209, 102, 0.45), 0 4px 0 #000;
}
.overlay a { color: #a59e90; }
.hud {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 10px;
  padding: 26px calc(14px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
  background: linear-gradient(transparent, rgba(0, 0, 0, 0.65)); transition: opacity 0.4s;
}
.hud button, .hud a {
  font: inherit; color: #fff; cursor: pointer; min-width: 38px; height: 34px; padding: 0 9px; border-radius: 8px; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.22);
}
.bar { flex: 1; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.18); position: relative; cursor: pointer; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #3ef0ff, #e01b3c); }
.time { min-width: 86px; text-align: right; color: #ccc; }
.idle .hud { opacity: 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<!-- ============================== HTML ============================== -->
<canvas id="stage" aria-label="Curta-metragem animada: Raio contra Sangue, uma luta de stickmans"></canvas>
<div class="hud" id="hud" hidden>
  <button id="play" title="Pausar / continuar (espaço)" aria-label="Pausar">❚❚</button>
  <button id="restart" title="Recomeçar (R)" aria-label="Recomeçar">↺</button>
  <button id="mute" title="Som (M)" aria-label="Som">🔊</button>
  <div class="bar" id="bar"><i id="fill"></i></div>
  <span class="time" id="time">0:00 / 1:30</span>
  <a href="../../index.html#animacoes" title="Voltar ao menu">Menu</a>
</div>
<div class="overlay" id="intro">
  <h1><span class="v">RAIO</span> × <span class="c">SANGUE</span></h1>
  <p>Uma curta de luta de stickmans: Volt, mestre dos raios, contra Carmim, que dobra o próprio sangue. Cerca de 1min30, com efeitos sonoros sintetizados ao vivo.</p>
  <button id="start">▶ Assistir</button>
  <a href="../../index.html#animacoes">← voltar ao menu</a>
</div>
<div class="overlay" id="outro" hidden>
  <h1>FIM</h1>
  <button id="again">↺ Assistir de novo</button>
  <a href="../../index.html#animacoes">← voltar ao menu</a>
</div>

  $('start').onclick = () => { $('intro').hidden = true; $('hud').hidden = false; started = true; startAt(0); wake(); };

  let W = 0, H = 0, DPR = 1;
  function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); }
