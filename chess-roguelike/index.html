<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Peões &amp; Perdição — Xadrez Roguelike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0d12; --panel: #1a171f; --panel2: #24202a; --line: #3d3745; --ink: #070609;
    --bone: #cdc4b4; --dim: #8b8391; --brass: #a8946a; --brass-d: #5f5238; --moss: #6c8269; --blood: #7e3838; --steel: #6e8593;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--bone);
    font-family: 'Pixelify Sans', ui-monospace, monospace; -webkit-tap-highlight-color: transparent; user-select: none; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; image-rendering: pixelated; }
  .hidden { display: none !important; }
  .px { image-rendering: pixelated; image-rendering: crisp-edges; }
  .ico { vertical-align: middle; display: inline-block; }
  h1, h2, h3, .btn, .pill, .title { font-family: 'Silkscreen', ui-monospace, monospace; font-weight: 400; }
  .btn { font-size: 14px; letter-spacing: .5px; padding: 9px 14px; border: 2px solid var(--ink); background: var(--panel2); color: var(--bone);
    box-shadow: inset -2px -2px 0 rgba(0,0,0,.5), inset 2px 2px 0 rgba(255,255,255,.07), 0 0 0 2px var(--line); cursor: pointer; text-transform: uppercase;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
  .btn:hover { filter: brightness(1.18); }
  .btn:active { box-shadow: inset 2px 2px 0 rgba(0,0,0,.5), 0 0 0 2px var(--line); transform: translateY(1px); }
  .btn:disabled { opacity: .4; cursor: default; filter: none; }
  .btn.main { background: var(--brass-d); color: #efe5cf; } .btn.danger { background: #4a2326; } .btn.calm { background: #2c3a39; }
  .btn.small { font-size: 12px; padding: 6px 9px; }
  .card { background: var(--panel); border: 2px solid var(--ink); box-shadow: 0 0 0 2px var(--line), 4px 4px 0 2px rgba(0,0,0,.55); }

  #screen { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; align-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px 28px; }
  #screen:empty { pointer-events: none; }
  .dim { background: linear-gradient(rgba(10,8,12,.45), rgba(10,8,12,.86)); }
  .logo { margin: 7vh 0 0; text-align: center; line-height: 1; }
  .logo .a { display: block; font-size: clamp(34px, 10vw, 84px); color: var(--bone); text-shadow: 3px 3px 0 var(--ink), 6px 6px 0 rgba(0,0,0,.35); }
  .logo .b { display: block; font-size: clamp(22px, 6.4vw, 54px); color: var(--brass); text-shadow: 3px 3px 0 var(--ink); margin-top: 6px; }
  .logo .c { display: block; margin-top: 14px; font-family: 'Pixelify Sans', monospace; font-size: clamp(14px, 3.6vw, 20px); color: var(--dim); letter-spacing: 3px; }
  .stack { display: flex; flex-direction: column; gap: 14px; align-items: stretch; width: min(320px, 100%); margin-top: 6vh; }
  .stack .btn { font-size: 15px; padding: 12px; }
  h2.big { font-size: clamp(22px, 6vw, 40px); margin: 10px 0 6px; text-align: center; color: var(--bone); text-shadow: 3px 3px 0 var(--ink); }
  .sub { color: var(--dim); font-size: 16px; text-align: center; margin: 0 0 12px; max-width: 560px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
  .choice { width: min(240px, 100%); padding: 14px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer;
    text-align: center; font-size: 15px; color: var(--bone); }
  .choice:hover { box-shadow: 0 0 0 2px var(--brass), 4px 4px 0 2px rgba(0,0,0,.55); }
  .choice.off { opacity: .4; cursor: default; box-shadow: 0 0 0 2px var(--line); }
  .choice h3 { margin: 0; font-size: 15px; color: var(--bone); }
  .choice .desc { color: var(--dim); font-size: 14px; line-height: 1.3; }
  .tag { font-family: 'Silkscreen', monospace; font-size: 11px; color: var(--brass); border: 2px solid var(--brass-d); padding: 1px 6px; display: inline-flex; gap: 4px; align-items: center; }
  .portrait { width: 64px; height: 72px; }
  .portrait.big { width: 96px; height: 108px; }
  .portrait.mini { width: 32px; height: 36px; }
  .army { display: flex; flex-wrap: wrap; gap: 0; justify-content: center; }

  /* Map */
  .maphead { position: sticky; top: 0; z-index: 3; width: min(560px, 100%); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .maphead .top { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .maphead h3 { margin: 0; font-size: 13px; text-align: center; flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: var(--panel2); border: 2px solid var(--ink); box-shadow: 0 0 0 2px var(--line);
    padding: 3px 8px; font-size: 13px; white-space: nowrap; color: var(--brass); }
  .amulets { display: flex; gap: 8px; flex-wrap: wrap; }
  .amulets img { cursor: pointer; }
  .mapwrap { position: relative; width: min(560px, 100%); flex: none; margin-top: 8px; }
  .mapwrap svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .node { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; background: var(--panel2); border: 2px solid var(--ink);
    box-shadow: 0 0 0 2px var(--line); display: grid; place-items: center; }
  .node.boss { width: 64px; height: 64px; margin: -32px 0 0 -32px; background: #2a1c20; }
  .node.avail { cursor: pointer; box-shadow: 0 0 0 2px var(--brass); animation: blink 1.2s steps(2) infinite; z-index: 2; }
  .node.done { opacity: .35; }
  .node.here { box-shadow: 0 0 0 2px var(--bone); opacity: 1; }
  .node.locked { opacity: .7; }
  @keyframes blink { 50% { box-shadow: 0 0 0 2px var(--bone), 0 0 0 4px var(--ink); background: #3a3328; } }
  .legend { color: var(--dim); font-size: 14px; text-align: center; margin: 8px 0; line-height: 1.6; }
  .legend img { margin: 0 2px 0 8px; }

  /* Battle HUD */
  #hud { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 8px; align-items: center; padding: max(10px, env(safe-area-inset-top)) 10px 0; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  #hudInfo { flex: 1; text-align: center; font-family: 'Silkscreen', monospace; font-size: clamp(10px, 2.8vw, 15px); color: var(--bone); text-shadow: 2px 2px 0 var(--ink); pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #panel { position: fixed; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(620px, calc(100% - 24px));
    padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  #panel .line { display: flex; align-items: center; gap: 10px; }
  #panel .txt { flex: 1; font-size: 14px; line-height: 1.3; min-height: 36px; color: var(--dim); }
  #panel .txt b { font-family: 'Silkscreen', monospace; font-weight: 400; font-size: 13px; color: var(--bone); }
  .bench { display: flex; gap: 2px; overflow-x: auto; padding: 4px; background: #121015; border: 2px solid var(--ink); min-height: 48px; align-items: center; }
  .bench .slot { border: 2px solid transparent; cursor: pointer; line-height: 0; }
  .bench .slot.sel { border-color: var(--brass); background: #2e2820; }
  .bench .empty { font-size: 13px; color: var(--dim); padding: 0 8px; }
  .turn { font-family: 'Silkscreen', monospace; font-size: 11px; padding: 4px 8px; border: 2px solid var(--ink); white-space: nowrap; }
  .turn.w { background: #2c3a39; } .turn.b { background: #4a2326; }

  #banner { position: fixed; left: 0; right: 0; top: 36%; text-align: center; pointer-events: none; font-family: 'Silkscreen', monospace;
    font-size: clamp(26px, 8vw, 60px); color: var(--bone); text-shadow: 3px 3px 0 var(--ink), 6px 6px 0 rgba(0,0,0,.4); opacity: 0; }
  #banner.show { animation: banner 1.3s steps(12) forwards; }
  @keyframes banner { 0% { opacity: 0; transform: translateY(16px); } 20% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
  #pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .pop { position: absolute; transform: translate(-50%, -50%); font-family: 'Silkscreen', monospace; font-size: 12px; color: var(--bone);
    text-shadow: 1px 1px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink); animation: pop 1.1s steps(10) forwards; white-space: nowrap; }
  .pop.red { color: #c26a5e; } .pop.blue { color: #9cb4c2; } .pop.gold { color: #c9b27c; }
  @keyframes pop { 0% { opacity: 0; margin-top: 6px; } 15% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; margin-top: -22px; } }

  #modal { position: fixed; inset: 0; background: rgba(8,6,10,.78); display: grid; place-items: center; padding: 16px; z-index: 20; }
  #modal > .card { width: min(480px, 100%); max-height: 86vh; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  #modal h3 { margin: 0 0 4px; font-size: 18px; text-align: center; color: var(--bone); }
  .unit { display: flex; align-items: center; gap: 10px; padding: 4px 8px; border: 2px solid var(--ink); background: var(--panel2); font-size: 14px; color: var(--dim); }
  .unit.pick { cursor: pointer; } .unit.pick:hover { box-shadow: 0 0 0 2px var(--brass); }
  .unit b { font-family: 'Silkscreen', monospace; font-weight: 400; font-size: 13px; color: var(--bone); }
  .muts { display: flex; flex-direction: column; gap: 3px; }
  .muts > span { display: flex; gap: 6px; align-items: flex-start; }
  .muts img { flex: none; margin-top: 1px; }
  .unit > div { flex: 1; min-width: 0; }
  #toast { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); z-index: 30; max-width: min(440px, 90vw); padding: 10px 14px;
    font-size: 15px; text-align: center; transition: opacity .25s; pointer-events: none; }
  .story { font-size: 17px; line-height: 1.5; padding: 16px; width: min(520px, 100%); text-align: center; color: var(--bone); }
  .help { font-size: 15px; line-height: 1.5; text-align: left; color: var(--dim); padding-left: 18px; margin: 0; }
  .help b { color: var(--bone); }
  .help li { margin-bottom: 6px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: 'Silkscreen', monospace; color: var(--dim); text-align: center; padding: 20px; }
</style>
</head>

<canvas id="cv"></canvas>
<div id="pops"></div>
<div id="hud" class="hidden">
  <button class="btn small" id="menuBtn">Menu</button>
  <div id="hudInfo"></div>
  <button class="btn small" id="viewBtn"></button>
  <span class="pill" id="hudGold"></span>
</div>
<div id="panel" class="card hidden"></div>
<div id="banner"></div>
<div id="screen"></div>
<div id="modal" class="hidden"></div>
<div id="toast" class="card" style="opacity:0"></div>
<div id="loading">Carregando…</div>

<script src="logic.js"></script>
<script>
  setTimeout(() => {
    if (!window.__ppReady) document.getElementById('loading').textContent = 'Não foi possível carregar o motor 3D (Three.js). Verifique a conexão e recarregue.';
  }, 10000);
</script>

    if (q.floor && q.y < 0.02) { q.y = 0.02; q.vy *= -0.2; q.vx *= 0.6; q.vz *= 0.6; }

// ================= Camera =================
const ISO_EL = 0.64, TOP_EL = 1.555, R = 22;

const tmpV = new THREE.Vector3();
function frameCamera(now, dt) {
  const target = prefs.view === 'top' && !bt.demo ? 1 : 0;

  if (Math.abs(target - viewBlend) < 0.002) viewBlend = target;
  const b = viewBlend;
  let az = (Math.PI / 4) * (1 - b);
  const el = ISO_EL + (TOP_EL - ISO_EL) * b;
  if (bt.demo) az += Math.sin(now / 6000) * 0.55;
  camera.position.set(Math.sin(az) * Math.cos(el) * R, Math.sin(el) * R, Math.cos(az) * Math.cos(el) * R);
  camera.up.set(0, 1, 0); camera.lookAt(0, 0, 0); camera.updateMatrixWorld(true);
  const hw = bt.st.w / 2 + 0.35, hh = bt.st.h / 2 + 0.35;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const sx of [-hw, hw]) for (const sz of [-hh, hh]) for (const sy of [-1.05, 1.1]) {
    tmpV.set(sx, sy, sz).applyMatrix4(camera.matrixWorldInverse);
    x0 = Math.min(x0, tmpV.x); x1 = Math.max(x1, tmpV.x); y0 = Math.min(y0, tmpV.y); y1 = Math.max(y1, tmpV.y);
  }
  const panel = $('#panel');
  const top = bt.demo ? 24 : 58;
  const bottom = bt.demo ? 24 : (panel.classList.contains('hidden') ? 16 : panel.offsetHeight + 22);
  const rw = W - 16, rh = Math.max(100, H - top - bottom);
  const s = Math.min(rw / (x1 - x0), rh / (y1 - y0)) * (bt.demo ? 0.9 : 1);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rcx = W / 2, rcy = top + rh / 2;
  let ox = 0, oy = 0;
  if (shake > 0.2) { ox = (Math.random() - 0.5) * shake / s; oy = (Math.random() - 0.5) * shake / s; shake *= Math.pow(0.004, dt); } else shake = 0;
  camera.left = cx - rcx / s + ox; camera.right = cx + (W - rcx) / s + ox;

// ================= Views & animation =================
let views = {}, dying = [];

function syncViews(st, hard) {
  if (hard) { for (const id in views) dropView(id); dying.forEach((d) => pieceGroup.remove(d.group)); dying = []; parts = []; }

  for (const p of st.pieces) {

    v.p = { ...p };
    if (!v.anim && (v.x !== p.x || v.y !== p.y)) jumpView(v, p.x, p.y, performance.now());

}
function jumpView(v, tx, ty, t0, dur) {

}

// Plays a turn's events, then calls done().
function playEvents(events, newSt, done) {
  const now = performance.now();
  let impact = now, total = 0;
  const mv = events.find((e) => e.type === 'move');
  const attacker = mv && views[mv.id];
  if (mv && attacker) {
    if (mv.bounced) {
      const tgt = events.find((e) => e.type === 'shield');
      attacker.anim = { type: 'bump', fx: attacker.x, fy: attacker.y, tx: tgt.x, ty: tgt.y, t0: now, dur: 420 };
      impact = now + 210; total = 420;
    } else {
      const dur = jumpView(attacker, mv.x, mv.y, now);
      impact = now + dur; total = dur;
    }
    sfx('hop');
  }
  const at = (t, fn) => setTimeout(fn, Math.max(0, t - performance.now()));
  let extra = 0;
  for (const e of events) {
    if (e.type === 'capture') {
      extra = Math.max(extra, 450);
      at(impact, () => {
        killView(e.id, attacker);
        const king = e.piece.type === 'K';
        shake = Math.max(shake, king ? 9 : 4); sfx('pow');
        if (king) { flash = 0.18; pop('Rei capturado', e.x, e.y, 'red'); }
      });
    } else if (e.type === 'shield') {
      extra = Math.max(extra, 300);
      at(impact, () => {
        spawn(wx(e.x), 0.4, wz(e.y), 22, ['#9cb4c2', '#6e8593', '#cdd6dc'], { speed: 2, up: 1.6, life: 650 });
        pop('Bloqueado', e.x, e.y, 'blue'); shake = Math.max(shake, 3); sfx('shield');
      });
    } else if (e.type === 'bomb') {
      extra = Math.max(extra, 800);
      at(impact + 160, () => {
        for (const id of e.ids) killView(id, { x: e.x, y: e.y });
        spawn(wx(e.x), 0.2, wz(e.y), 70, ['#3a3536', '#57504c', '#b0602e', '#d89a50'], { speed: 3, up: 3, spread: 1, life: 1100 });
        flash = 0.32; shake = 12; pop('Explosão', e.x, e.y, 'red'); sfx('boom');
      });
    } else if (e.type === 'promote') {
      extra = Math.max(extra, 450);
      at(impact + 120, () => {
        spawn(wx(mv.x), 0.3, wz(mv.y), 26, ['#d2c08a', '#a8946a', '#e6dcc4'], { speed: 0.6, up: 2.6, grav: -0.5, life: 1000, floor: false });
        pop('Promoção', mv.x, mv.y, 'gold'); sfx('promo');
      });
    } else if (e.type === 'vampire') {
      at(impact + 200, () => { const v = views[e.id]; if (!v) return; spawn(wx(v.x), 0.4, wz(v.y), 14, ['#7a3044', '#4a1c28'], { speed: 1, up: 1.2 }); pop('Sangue', v.x, v.y, 'red'); });
    } else if (e.type === 'summon') {

      at(impact + 100, () => {

}

// ================= Main loop =================
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  applyTheme(bt ? bt.act : run ? run.act : 1);
  boardGroup.visible = pieceGroup.visible = hlGroup.visible = !!bt;
  if (bt) {
    frameCamera(now, dt);
    stepViews(now);
    syncPieceObjects(now);
    updateHighlights(now);
    for (const l of lava) l.material.color.setRGB(0.42 + 0.08 * Math.sin(now / 500 + l.position.x * 3), 0.13, 0.05);
    if (candle) warm.intensity = theme.warmI * (0.85 + 0.15 * Math.sin(now / 90) * Math.sin(now / 37));
  }
  updateParticles(now, dt);
  flash *= Math.pow(0.02, dt);
  post.uniforms.flash.value = flash;
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  requestAnimationFrame(frame);
}

let run = null, bt = null;
function makeDemo() {

  const seed = (Math.random() * 1e9) | 0;
  const enc = C.makeEncounter(seed, act, 'demo', 'battle', 2);
  const army = [{ id: 1, type: 'K', muts: [] }, { id: 2, type: 'Q', muts: [] }, { id: 3, type: 'N', muts: ['shield'] }, { id: 4, type: 'B', muts: [] },
    { id: 5, type: 'P', muts: [] }, { id: 6, type: 'P', muts: ['hop'] }, { id: 7, type: 'P', muts: [] }, { id: 8, type: 'R', muts: ['bomb'] }];
  const { placed, rows } = C.autoDeploy(enc, army, []);
  bt = { demo: true, act, enc, st: C.startBattle(enc, army, placed, []), rows, placed, phase: 'demo', moves: [], sel: null, last: null };
  buildBoard();
  syncViews(bt.st, true);
  const id = bt.id = Math.random();
  const tick = () => {
    if (!bt || bt.id !== id) return;
    if (bt.st.winner) { setTimeout(() => { if (bt && bt.id === id) makeDemo(); }, 1400); return; }
    const mv = C.bestMove(bt.st, { depth: 1, noise: 400 });
    const r = mv ? C.applyMove(bt.st, mv) : C.passTurn(bt.st);
    const m = r.events.find((e) => e.type === 'move');
    if (m) bt.last = { from: m.from, to: { x: m.x, y: m.y } };
    bt.st = r.st;

}

function showHelp() {
  openModal(`<h3>Como jogar</h3>
    <ul class="help">

      <li><b>Vista:</b> o botão "Vista" (ou a tecla V) alterna entre a câmera isométrica e a vista de cima. Na vista de cima, marcadores mostram o tipo de cada peça.</li>

// ================= Run flow =================

  makeDemo();
  setScreen(`<h2 class="big">Escolha seu Rei</h2><p class="sub">Cada Rei começa com um exército e um amuleto diferentes.</p>

        <div class="row" style="gap:8px">${k.amulets.map((a) => `<span class="tag">${icon(C.AMULETS[a].icon, 1)} ${C.AMULETS[a].name}</span>`).join('')}<span class="tag">${coin(k.gold)}</span></div>
      </div>`).join('')}</div>
    <div style="margin-top:18px"><button class="btn small" data-act="title">Voltar</button></div>`);

function newRun(i) {
  const K = C.KINGS[i];
  const seed = (Math.random() * 2 ** 31) | 0;
  run = {
    seed, act: 1, map: C.makeMap(seed, 1), pos: null, visited: [], inNode: false,
    army: K.army.map(([type, ...muts], j) => ({ id: j + 1, type, muts })), nextId: K.army.length + 1,
    gold: K.gold, amulets: K.amulets.slice(), king: K.id, shop: null, event: null,
    stats: { battles: 0, captures: 0, lost: 0, floors: 0 },
  };
  save();
  showMap();
  setTimeout(() => banner('Ato I'), 200);
}
function continueRun() {
  run = store.get(SAVE_KEY);
  if (!run) return showTitle();
  if (run.reward) showReward();
  else if (run.inNode && run.pos) enterNode(run.pos, true);
  else showMap();
}
function available() { return run.pos ? run.map.nodes[run.pos].next : run.map.floors[0]; }
function showMap() {
  bt = null; setHud(false); closeModal();
  const m = run.map, rowH = 84, F = m.floors.length;
  const avail = new Set(run.inNode ? [] : available());
  const pos = (n) => [10 + n.col * 80, (F - 1 - n.f) * rowH + 50];
  const H0 = F * rowH + 30;
  let lines = '';
  for (const id in m.nodes) {
    const n = m.nodes[id];
    for (const t of n.next) {
      const [x1, y1] = pos(n), [x2, y2] = pos(m.nodes[t]);
      const walked = run.visited.includes(id) && run.visited.includes(t);
      lines += `<line x1="${x1}%" y1="${y1}" x2="${x2}%" y2="${y2}" stroke="${walked ? '#a8946a' : '#4d4656'}" stroke-width="${walked ? 4 : 2}" stroke-dasharray="${walked ? '' : '4 6'}" shape-rendering="crispEdges"/>`;
    }
  }
  const nodes = Object.values(m.nodes).map((n) => {
    const [x, y] = pos(n);
    const cls = ['node', n.type === 'boss' ? 'boss' : '', avail.has(n.id) ? 'avail' : run.visited.includes(n.id) ? 'done' : 'locked', run.pos === n.id ? 'here' : ''].join(' ');
    return `<div class="${cls}" style="left:${x}%;top:${y}px" title="${NODE_NAME[n.type]}" ${avail.has(n.id) ? `data-act="enter" data-arg="${n.id}"` : ''}>${icon(NODE_ICON[n.type], n.type === 'boss' ? 4 : 2)}</div>`;
  }).join('');
  setScreen(`
    <div class="maphead card">
      <div class="top"><button class="btn small" data-act="menu">Menu</button><h3>${ACTS[run.act].name}</h3><span class="pill">${coin(run.gold)}</span></div>
      <div class="top"><div class="army" style="justify-content:flex-start">${run.army.map((u) => portrait(u.type, 'w', u.muts, 'mini')).join('')}</div>
        <button class="btn small" data-act="armyView">Exército</button></div>
      ${run.amulets.length ? `<div class="amulets">${run.amulets.map((a) => `<span data-act="amuletInfo" data-arg="${a}" title="${C.AMULETS[a].name}">${icon(C.AMULETS[a].icon, 2)}</span>`).join('')}</div>` : ''}
    </div>
    <p class="legend">Chefe: <b>${C.BOSSES[run.act].name}</b> — ${C.BOSSES[run.act].desc}<br>
      ${['battle', 'elite', 'shop', 'event', 'rest'].map((t) => `${icon(NODE_ICON[t], 1.5)}${NODE_NAME[t]}`).join(' ')}</p>
    <div class="mapwrap" style="height:${H0}px"><svg>${lines}</svg>${nodes}</div>`);
  wire(screen);
  const first = screen.querySelector('.node.avail');
  if (first) first.scrollIntoView({ block: 'center' });
}
function enterNode(id, resumed) {
  const n = run.map.nodes[id];
  if (!resumed) {
    run.pos = id; run.visited.push(id); run.inNode = true; run.stats.floors++;
    run.shop = null; run.event = null;
    save();
  }
  if (n.type === 'battle' || n.type === 'elite' || n.type === 'boss') startEncounter(n.type);
  else if (n.type === 'shop') showShop();
  else if (n.type === 'event') showEvent();
  else showRest();
}
function leaveNode() {
  const n = run.map.nodes[run.pos];
  run.inNode = false; run.shop = null; run.event = null;
  if (n.type === 'boss') {
    if (run.act === 3) return showVictory();
    run.act++; run.map = C.makeMap(run.seed, run.act); run.pos = null; run.visited = [];
    save(); showMap(); setTimeout(() => banner(run.act === 2 ? 'Ato II' : 'Ato III'), 200);
    return;
  }
  save(); showMap();
}
function addPiece(type, muts = []) {
  if (run.army.length >= ARMY_CAP) { toast('Exército cheio (máx. ' + ARMY_CAP + ')'); return false; }
  run.army.push({ id: run.nextId++, type, muts: muts.slice() });
  return true;
}
function pickPiece(title, filter, cb) {
  const list = run.army.filter(filter);
  openModal(`<h3>${title}</h3>
    ${list.length ? list.map((u) => `<div class="unit pick" data-act="picked" data-arg="${u.id}">${portrait(u.type, 'w', u.muts)}<div><b>${C.NAMES[u.type]}</b>${mutList(u.muts)}</div></div>`).join('') : '<p class="help">Nenhuma peça pode receber isso.</p>'}
    <button class="btn" data-act="closeModal">Cancelar</button>`);
  pickPiece.cb = cb;
  wire(modal);
}
const mutTarget = (m) => (u) => C.canMutate(u.type, u.muts, m);

// ================= Battle =================
function startEncounter(kind) {
  const node = run.map.nodes[run.pos];
  const enc = C.makeEncounter(run.seed, run.act, run.pos, kind, node.f);
  const dep = C.autoDeploy(enc, run.army, run.amulets);
  bt = {
    act: run.act, enc, kind, placed: dep.placed, bench: dep.bench, rows: dep.rows, phase: 'deploy',
    sel: null, selArmy: null, benchSel: null, moves: [], movesSide: 'w', last: null, lostOrder: [], captures: 0,
    rng: C.makeRng(C.hash(run.seed, run.pos, 'ai', run.stats.floors)),
  };
  bt.st = C.startBattle(enc, run.army, bt.placed, run.amulets);
  buildBoard();
  syncViews(bt.st, true);
  setScreen('', false); setHud(true);
  updateHud(); updatePanel();
  if (kind === 'boss') setTimeout(() => banner(enc.boss.name), 150);
  else if (kind === 'elite') setTimeout(() => banner('Elite'), 150);
}
function rebuildDeploy() {
  bt.st = C.startBattle(bt.enc, run.army, bt.placed, run.amulets);
  syncViews(bt.st);
  updatePanel();
}
function updateHud() {
  if (!bt || bt.demo) return;
  const n = run.map.nodes[run.pos];
  $('#hudInfo').textContent = bt.kind === 'boss' ? bt.enc.boss.name : bt.kind === 'elite' ? 'Elite' : `Batalha · andar ${n.f + 1}`;
  $('#hudGold').innerHTML = coin(run.gold);
}
function updatePanel() {
  if (!bt || bt.demo) return;
  const st = bt.st;
  let html = '';
  if (bt.phase === 'deploy') {
    const selU = bt.selArmy != null ? run.army.find((u) => u.id === bt.selArmy) : bt.benchSel != null ? run.army.find((u) => u.id === bt.benchSel) : null;
    html += `<div class="line">${selU ? portrait(selU.type, 'w', selU.muts, 'mini') : ''}<div class="txt">${selU
      ? `<b>${C.NAMES[selU.type]}</b><br>${mutList(selU.muts)}`
      : '<b>Posicione suas tropas</b><br>Toque numa peça e depois numa casa marcada para mover ou trocar.'}</div>
      ${bt.selArmy != null && selU && selU.type !== 'K' ? '<button class="btn small" data-act="toBench">Banco</button>' : ''}
      <button class="btn main" data-act="fight">Lutar</button></div>`;
    html += `<div class="bench">${bt.bench.length ? bt.bench.map((id) => {
      const u = run.army.find((a) => a.id === id);
      return `<div class="slot${bt.benchSel === id ? ' sel' : ''}" data-act="benchPick" data-arg="${id}">${portrait(u.type, 'w', u.muts, 'mini')}</div>`;
    }).join('') : '<span class="empty">Banco vazio: todas as peças estão em campo.</span>'}</div>`;
    if (bt.enc.boss) html += `<div class="txt" style="min-height:0"><b>${bt.enc.boss.name}</b> ${bt.enc.boss.desc}</div>`;
  } else {
    const p = bt.sel && C.byId(st, bt.sel);
    const turn = bt.phase === 'player' ? '<span class="turn w">Sua vez</span>' : '<span class="turn b">Inimigo</span>';
    let txt;
    if (p) txt = `<b>${p.side === 'w' ? '' : 'Inimigo: '}${C.NAMES[p.type]}</b>${p.shield ? ' (escudo)' : ''}<br>${mutList(p.muts)}`;
    else if (bt.enc.boss) txt = `<b>${bt.enc.boss.name}</b><br>${bt.enc.boss.desc}`;
    else txt = '<b>Capture o Rei inimigo</b><br>Toque numa peça para ver os lances.';
    html += `<div class="line">${p ? portrait(p.type, p.side, p.muts, 'mini') : ''}<div class="txt">${txt}</div>${turn}</div>`;
  }
  panel.innerHTML = html;
  wire(panel);
}
const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function pickAt(sx, sy) {
  raycaster.setFromCamera(new THREE.Vector2((sx / W) * 2 - 1, -(sy / H) * 2 + 1), camera);
  const pt = raycaster.ray.intersectPlane(groundPlane, new THREE.Vector3());
  let tile = null;
  if (pt) {
    const x = Math.round(pt.x + (bt.st.w - 1) / 2), y = Math.round(pt.z + (bt.st.h - 1) / 2);
    if (x >= 0 && y >= 0 && x < bt.st.w && y < bt.st.h) tile = [x, y];
  }
  // The exact tile wins when it holds a piece or a move target; otherwise a piece's body under the pointer.
  if (tile && (C.pieceAt(bt.st, ...tile) || bt.moves.some((m) => m.x === tile[0] && m.y === tile[1]))) return tile;
  const hits = raycaster.intersectObjects(pieceGroup.children, true);
  for (const h of hits) {
    let o = h.object;
    while (o && !o.userData.viewId) o = o.parent;
    const v = o && views[o.userData.viewId];
    if (v && !v.anim) return [Math.round(v.x), Math.round(v.y)];
  }
  return tile;
}
const tileFree = (x, y) => C.tileAt(bt.st, x, y) === C.FLOOR;
function onBoardTap(sx, sy) {
  if (!bt || bt.demo) return;
  if (bt.phase !== 'deploy' && bt.phase !== 'player') return;
  const hit = pickAt(sx, sy);
  if (!hit) { bt.sel = null; bt.selArmy = null; bt.benchSel = null; bt.moves = []; updatePanel(); return; }
  const [x, y] = hit;
  const occ = C.pieceAt(bt.st, x, y);
  if (bt.phase === 'deploy') {
    const inRows = bt.rows.includes(y) && tileFree(x, y);
    const occW = occ && occ.side === 'w' ? occ.armyId : null;
    if (bt.benchSel != null && inRows) {
      if (occW != null) {
        if (run.army.find((u) => u.id === occW).type === 'K') { toast('O Rei não pode ir para o banco.'); return; }
        bt.placed = bt.placed.filter((p) => p.id !== occW); bt.bench.push(occW);
      }
      bt.placed.push({ id: bt.benchSel, x, y }); bt.bench = bt.bench.filter((id) => id !== bt.benchSel); bt.benchSel = null;
      sfx('hop'); rebuildDeploy(); return;
    }
    if (bt.selArmy != null && inRows && occW !== bt.selArmy) {
      const me = bt.placed.find((p) => p.id === bt.selArmy);
      if (occW != null) { const other = bt.placed.find((p) => p.id === occW); other.x = me.x; other.y = me.y; }
      me.x = x; me.y = y; bt.selArmy = null;
      sfx('hop'); rebuildDeploy(); return;
    }
    if (occ) {
      bt.benchSel = null;
      if (occ.side === 'w') { bt.selArmy = bt.selArmy === occW ? null : occW; bt.sel = null; bt.moves = []; }
      else { bt.selArmy = null; bt.sel = occ.id; bt.moves = C.pieceMoves(bt.st, occ); bt.movesSide = 'b'; }
    } else { bt.selArmy = null; bt.sel = null; bt.moves = []; }
    updatePanel();
    return;
  }
  const mv = bt.movesSide === 'w' && bt.moves.find((m) => m.x === x && m.y === y);
  if (mv) return tryMove(mv);
  if (occ) {
    if (bt.sel === occ.id) { bt.sel = null; bt.moves = []; }
    else { bt.sel = occ.id; bt.moves = C.pieceMoves(bt.st, occ); bt.movesSide = occ.side; sfx('click'); }
  } else { bt.sel = null; bt.moves = []; }
  updatePanel();
}
function tryMove(mv) {
  const p = C.byId(bt.st, mv.id);
  const willPromote = p.type === 'P' && mv.y <= bt.st.rules.promo.w && !(mv.cap && C.byId(bt.st, mv.cap).shield);
  if (willPromote) {
    openModal(`<h3>Promover para</h3><div class="row">${['Q', 'R', 'B', 'N'].map((t) =>
      `<div class="card choice" style="width:96px;padding:8px" data-act="promo" data-arg="${t}">${portrait(t, 'w', p.muts)}<h3>${C.NAMES[t]}</h3></div>`).join('')}</div>`);
    tryMove.pending = mv;
    wire(modal);
    return;
  }
  doMove(mv);
}
function doMove(mv, promo) {
  bt.phase = 'anim';
  resolve(C.applyMove(bt.st, mv, promo));
}
function resolve(r) {
  bt.sel = null; bt.moves = [];
  const m = r.events.find((e) => e.type === 'move');
  if (m) bt.last = { from: m.from, to: { x: m.x, y: m.y } };
  for (const e of r.events) {
    const dead = e.type === 'capture' ? [e.piece] : e.type === 'bomb' ? e.pieces : [];
    for (const d of dead) {
      if (d.side === 'b') bt.captures++;
      else if (d.armyId != null) bt.lostOrder.push(d.armyId);
    }
  }
  bt.st = r.st;
  updatePanel();
  const myBt = bt;
  playEvents(r.events, r.st, () => { if (bt === myBt) afterTurn(); });
}
function afterTurn() {
  const st = bt.st;
  if (st.winner) return endBattle(st.winner);
  if (st.turn === 'w') {
    if (!C.allMoves(st, 'w').length) { bt.phase = 'anim'; return resolve(C.passTurn(st)); }
    bt.phase = 'player';
    updatePanel();
  } else {
    bt.phase = 'enemy'; updatePanel();
    const myBt = bt;
    setTimeout(() => {
      if (bt !== myBt) return;
      const mv = C.bestMove(bt.st, { depth: bt.enc.depth, noise: bt.enc.noise, rng: bt.rng });
      resolve(mv ? C.applyMove(bt.st, mv) : C.passTurn(bt.st));
    }, 380);
  }
}
function endBattle(winner) {
  bt.phase = 'end'; updatePanel();
  const res = C.settleArmy(run.army, bt.st, bt.placed.map((p) => p.id), run.amulets, bt.lostOrder);
  run.stats.captures += bt.captures;
  run.stats.lost += res.lost.length;
  if (winner === 'b') {
    sfx('lose'); banner('Seu Rei caiu');
    setTimeout(() => showGameOver(), 1600);
    return;
  }
  run.army = res.army;
  run.stats.battles++;
  const gold = winner === 'w' ? C.goldFor(bt.kind, run.act, run.amulets, bt.captures) : 0;
  run.gold += gold;
  const offers = winner === 'w' ? C.makeOffers(C.rngFor(run.seed, 'offer', run.act, run.pos), run.act, bt.kind, run.amulets) : [];
  run.reward = { offers, gold, lost: res.lost, revived: res.revived, draw: winner === 'draw', kind: bt.kind };
  save();
  sfx(winner === 'w' ? 'win' : 'land');
  banner(winner === 'w' ? 'Vitória' : 'Empate');
  setTimeout(showReward, 1500);
}
function offerCard(o, i, act) {
  let inner, off = false;
  if (o.kind === 'piece') { inner = `${portrait(o.type)}<h3>${C.NAMES[o.type]}</h3><div class="desc">Nova peça para o exército.</div><span class="tag">Peça</span>`; off = run.army.length >= ARMY_CAP; }
  else if (o.kind === 'mut') { const M = C.MUTATIONS[o.id]; inner = `${icon(M.icon, 4)}<h3>${M.name}</h3><div class="desc">${M.desc}</div><span class="tag">Mutação</span>`; off = !run.army.some(mutTarget(o.id)); }
  else { const A = C.AMULETS[o.id]; inner = `${icon(A.icon, 4)}<h3>${A.name}</h3><div class="desc">${A.desc}</div><span class="tag">Amuleto</span>`; }
  return { inner, off, html: `<div class="card choice${off ? ' off' : ''}" ${off ? '' : `data-act="${act}" data-arg="${i}"`}>${inner}</div>` };
}
function showReward() {
  bt = null; setHud(false);
  const r = run.reward;
  setScreen(`<h2 class="big">${r.draw ? 'Empate' : r.kind === 'boss' ? 'Chefe derrotado' : 'Vitória'}</h2>
    <p class="sub">${r.draw ? 'O inimigo recuou depois de uma batalha interminável. Sem espólios desta vez.' : `+${coin(r.gold)} de ouro`}</p>
    ${r.lost.length ? `<p class="sub">Caídos em combate:</p><div class="army">${r.lost.map((u) => portrait(u.type, 'w', u.muts)).join('')}</div>` : ''}
    ${r.revived ? `<p class="sub">A Pena de Fênix trouxe de volta: ${C.NAMES[r.revived.type]}.</p>` : ''}
    ${r.offers.length ? `<p class="sub" style="margin-top:14px">Escolha uma recompensa:</p><div class="row">${r.offers.map((o, i) => offerCard(o, i, 'takeOffer').html).join('')}</div>` : ''}
    <div style="margin-top:20px"><button class="btn" data-act="skipReward">${r.offers.length ? 'Pular' : 'Continuar'}</button></div>`);
  wire(screen);
}
function finishReward() { run.reward = null; leaveNode(); }
function statsBlock(s) {
  return `Batalhas vencidas: <b>${s.battles}</b><br>Peças capturadas: <b>${s.captures}</b><br>Peças perdidas: <b>${s.lost}</b><br>Locais visitados: <b>${s.floors}</b>`;
}
function showGameOver() {
  bt = null; setHud(false);
  store.del(SAVE_KEY);
  setScreen(`<h2 class="big" style="color:#c26a5e">Seu Rei caiu</h2>
    <div class="card story">A jornada terminou em <b>${ACTS[run.act].name}</b>.<br><br>${statsBlock(run.stats)}</div>
    <div class="stack" style="margin-top:20px"><button class="btn main" data-act="newRun">Tentar de novo</button><button class="btn" data-act="title">Título</button></div>`);
  run = null;
  wire(screen);
}
function showVictory() {
  store.del(SAVE_KEY);
  sfx('win');
  setScreen(`<h1 class="logo"><span class="a">VITÓRIA</span><span class="b">a Rainha Vermelha caiu</span></h1>
    <div class="card story" style="margin-top:20px">Seu exército atravessou os três atos.<br><br>${statsBlock(run.stats)}
      <div class="army" style="margin-top:12px">${run.army.map((u) => portrait(u.type, 'w', u.muts, 'mini')).join('')}</div></div>
    <div class="stack" style="margin-top:20px"><button class="btn main" data-act="newRun">Nova jornada</button><button class="btn" data-act="title">Título</button></div>`);
  run = null;
  wire(screen);
}

// ================= Shop / event / rest =================
function showShop() {
  bt = null; setHud(false);
  if (!run.shop) {
    const r = C.rngFor(run.seed, 'shop', run.act, run.pos);
    const items = [];
    for (let i = 0; i < 3; i++) { const t = r.pick(i === 0 ? ['P', 'N', 'B'] : ['P', 'N', 'B', 'R', 'Q']); items.push({ kind: 'piece', type: t, price: C.PRICE[t] }); }
    for (const m of r.shuffle(Object.keys(C.MUTATIONS).filter((k) => !C.MUTATIONS[k].hidden)).slice(0, 2)) items.push({ kind: 'mut', id: m, price: C.MUT_PRICE });
    const free = Object.keys(C.AMULETS).filter((a) => !run.amulets.includes(a));
    if (free.length) items.push({ kind: 'amulet', id: r.pick(free), price: C.AMULET_PRICE });
    run.shop = { items }; save();
  }
  const card = (it, i) => {
    const base = offerCard(it, i, 'buy');
    const off = it.sold || run.gold < it.price || base.off;
    return `<div class="card choice${off ? ' off' : ''}" style="width:min(170px,46%)" ${off ? '' : `data-act="buy" data-arg="${i}"`}>${base.inner}
      <span class="tag">${it.sold ? 'Vendido' : coin(it.price)}</span></div>`;
  };
  setScreen(`<h2 class="big">Mercador Encapuzado</h2><p class="sub">"Nada aqui está amaldiçoado. Quase nada." Você tem ${coin(run.gold)}.</p>
    <div class="row">${run.shop.items.map(card).join('')}</div>
    <div style="margin-top:20px"><button class="btn" data-act="leave">Sair da loja</button></div>`);
  wire(screen);
}

const EVENTS = {
  fountain: {
    title: 'Fonte Turva', text: 'Uma fonte de água escura borbulha entre ruínas. Dizem que quem bebe dela muda.',
    options: () => [{ label: 'Uma peça bebe (mutação aleatória)', go: 'fountainDrink' }, { label: 'Melhor não', go: 'nothing' }],
  },
  merc: {
    title: 'Mercenário Suspeito', text: 'Um vulto encapuzado oferece seus serviços. "Sou ótimo. Confie."',
    options: () => [{ label: 'Contratar (60 de ouro)', go: 'mercHire', off: run.gold < 60 || run.army.length >= ARMY_CAP }, { label: 'Recusar', go: 'nothing' }],
  },
  altar: {
    title: 'Altar Sombrio', text: 'Um altar de pedra pede um sacrifício humilde. Em troca, promete poder.',
    options: () => [{ label: 'Sacrificar um Peão (ganha amuleto)', go: 'altarSacrifice', off: !run.army.some((u) => u.type === 'P') || run.amulets.length >= Object.keys(C.AMULETS).length }, { label: 'Ir embora', go: 'nothing' }],
  },
  chest: {
    title: 'Baú Esquecido', text: 'Um baú coberto de musgo no meio da estrada. Não parece armadilha. Não muito.',
    options: () => [{ label: 'Abrir', go: 'chestOpen' }, { label: 'Deixar quieto', go: 'nothing' }],
  },
  village: {
    title: 'Aldeia Abandonada', text: 'Os últimos moradores querem ajudar sua causa.',
    options: () => [{ label: 'Recrutar 2 Peões', go: 'villageRecruit', off: run.army.length >= ARMY_CAP }, { label: 'Aceitar 45 de ouro', go: 'villageGold' }],
  },
};
const EVENT_FX = {
  nothing: () => 'Você segue viagem.',
  fountainDrink: (r) => {
    const opts = run.army.filter((u) => u.type !== 'K').flatMap((u) => Object.keys(C.MUTATIONS).filter((m) => !C.MUTATIONS[m].hidden && C.canMutate(u.type, u.muts, m)).map((m) => [u, m]));
    if (!opts.length || r() < 0.2) { run.gold = Math.max(0, run.gold - 25); return 'A água era podre. Você gastou 25 de ouro em remédios.'; }
    const [u, m] = r.pick(opts); u.muts.push(m);
    return `Seu ${C.NAMES[u.type]} ganhou <b>${C.MUTATIONS[m].name}</b>.`;
  },
  mercHire: (r) => { const t = r.pick(['N', 'B', 'R']); run.gold -= 60; addPiece(t); return `Um ${C.NAMES[t]} se junta ao exército.`; },
  altarSacrifice: (r) => {
    const victim = r.pick(run.army.filter((u) => u.type === 'P'));
    run.army = run.army.filter((u) => u !== victim);
    const a = r.pick(Object.keys(C.AMULETS).filter((k) => !run.amulets.includes(k))); run.amulets.push(a);
    return `O peão desaparece numa fumaça cinzenta. Você recebeu <b>${C.AMULETS[a].name}</b>.`;
  },
  chestOpen: (r) => {
    if (r() < 0.7) { const g = 50 + Math.floor(r() * 40); run.gold += g; return `Ouro. +${g}.`; }
    const pawns = run.army.filter((u) => u.type === 'P');
    if (!pawns.length) return 'Era um mímico. Sem peões para morder, ele se arrastou de volta para a escuridão.';
    const v = r.pick(pawns); run.army = run.army.filter((u) => u !== v);
    return 'Era um mímico. Ele engoliu um peão e sumiu na névoa.';
  },
  villageRecruit: () => { addPiece('P'); addPiece('P'); return 'Dois peões se alistam.'; },
  villageGold: () => { run.gold += 45; return 'Os moradores juntam o pouco que têm: +45 de ouro.'; },
};
function showEvent() {
  bt = null; setHud(false);
  if (!run.event) {
    const r = C.rngFor(run.seed, 'event', run.act, run.pos);
    run.event = { id: r.pick(Object.keys(EVENTS)), result: null }; save();
  }
  const E = EVENTS[run.event.id];
  const body = run.event.result
    ? `<div class="card story">${run.event.result}</div><div style="margin-top:18px"><button class="btn main" data-act="leave">Continuar</button></div>`
    : `<div class="card story">${E.text}</div><div class="stack" style="margin-top:18px">${E.options().map((o) =>
      `<button class="btn${o.go === 'nothing' ? '' : ' main'}" data-act="eventChoose" data-arg="${o.go}" ${o.off ? 'disabled' : ''}>${o.label}</button>`).join('')}</div>`;
  setScreen(`<div style="margin-top:4vh">${icon('event', 4)}</div><h2 class="big">${E.title}</h2>${body}`);
  wire(screen);
}
function showRest() {
  bt = null; setHud(false);
  setScreen(`<div style="margin-top:4vh">${icon('fire', 4)}</div><h2 class="big">Fogueira</h2>
    <div class="card story">Suas tropas descansam ao redor do fogo. Ninguém fala muito sobre a última batalha.</div>
    <div class="stack" style="margin-top:18px">
      <button class="btn main" data-act="restTrain">Treinar: uma peça ganha mutação aleatória</button>
      <button class="btn" data-act="restRecruit" ${run.army.length >= ARMY_CAP ? 'disabled' : ''}>Recrutar: +1 Cavalo ou Bispo</button>
    </div>`);
  wire(screen);
}
function showArmy() {
  openModal(`<h3>Seu exército (${run.army.length}/${ARMY_CAP})</h3>
    ${run.army.map((u) => `<div class="unit">${portrait(u.type, 'w', u.muts)}<div><b>${C.NAMES[u.type]}</b>${mutList(u.muts)}</div></div>`).join('')}
    ${run.amulets.length ? `<h3>Amuletos</h3>${run.amulets.map((a) => `<div class="unit">${icon(C.AMULETS[a].icon, 3)}<div><b>${C.AMULETS[a].name}</b><br>${C.AMULETS[a].desc}</div></div>`).join('')}` : ''}
    <button class="btn" data-act="closeModal">Fechar</button>`);
  wire(modal);
}
function showMenu() {
  openModal(`<h3>Pausa</h3>
    <button class="btn main" data-act="closeModal">Voltar ao jogo</button>
    ${run ? '<button class="btn" data-act="armyView">Exército</button>' : ''}
    <button class="btn" data-act="help">Como jogar</button>
    <button class="btn" data-act="view">${prefs.view === 'top' ? 'Vista: de cima' : 'Vista: isométrica'}</button>
    <button class="btn" data-act="marks">${prefs.marks ? 'Marcadores (vista de cima): ligados' : 'Marcadores (vista de cima): desligados'}</button>
    <button class="btn" data-act="mute">${prefs.muted ? 'Som: desligado' : 'Som: ligado'}</button>
    <button class="btn danger" data-act="abandon">Abandonar jornada</button>
    <a class="btn" href="../index.html">Menu de jogos</a>`);
  wire(modal);
}

// ================= Actions =================
const ACTIONS = {
  title: () => { closeModal(); showTitle(); },
  newRun: () => { closeModal(); showKingSelect(); },
  continue: () => continueRun(),
  help: () => showHelp(),
  closeModal: () => closeModal(),
  mute: (arg, el) => { prefs.muted = !prefs.muted; savePrefs(); el.textContent = prefs.muted ? 'Som: desligado' : 'Som: ligado'; },
  view: (arg, el) => { toggleView(); el.textContent = prefs.view === 'top' ? 'Vista: de cima' : 'Vista: isométrica'; },
  marks: (arg, el) => { prefs.marks = !prefs.marks; savePrefs(); el.textContent = prefs.marks ? 'Marcadores (vista de cima): ligados' : 'Marcadores (vista de cima): desligados'; },
  pickKing: (i) => newRun(+i),
  enter: (id) => enterNode(id),
  menu: () => showMenu(),
  armyView: () => showArmy(),
  amuletInfo: (a) => toast(`<b>${C.AMULETS[a].name}</b><br>${C.AMULETS[a].desc}`),
  abandon: () => {
    openModal(`<h3>Abandonar?</h3><p class="help" style="padding:0">A jornada atual será perdida para sempre.</p>
      <button class="btn danger" data-act="abandonYes">Sim, abandonar</button><button class="btn" data-act="closeModal">Não</button>`);
    wire(modal);
  },
  abandonYes: () => { store.del(SAVE_KEY); run = null; closeModal(); showTitle(); },
  picked: (id) => { const u = run.army.find((a) => a.id === +id); closeModal(); if (u && pickPiece.cb) pickPiece.cb(u); },
  benchPick: (id) => { id = +id; bt.benchSel = bt.benchSel === id ? null : id; bt.selArmy = null; bt.sel = null; bt.moves = []; updatePanel(); },
  toBench: () => {
    if (bt.selArmy == null) return;
    bt.placed = bt.placed.filter((p) => p.id !== bt.selArmy); bt.bench.push(bt.selArmy); bt.selArmy = null; rebuildDeploy();
  },
  fight: () => {
    bt.sel = null; bt.selArmy = null; bt.benchSel = null; bt.moves = [];
    bt.st = C.startBattle(bt.enc, run.army, bt.placed, run.amulets);
    syncViews(bt.st);
    bt.phase = 'player'; banner('Lutem'); updatePanel();
  },
  promo: (t) => { closeModal(); const mv = tryMove.pending; tryMove.pending = null; if (mv) doMove(mv, t); },
  takeOffer: (i) => {
    const o = run.reward.offers[+i];
    if (o.kind === 'piece') { if (addPiece(o.type)) finishReward(); }
    else if (o.kind === 'amulet') { run.amulets.push(o.id); finishReward(); }
    else pickPiece(`Quem recebe ${C.MUTATIONS[o.id].name}?`, mutTarget(o.id), (u) => { u.muts.push(o.id); finishReward(); });
  },
  skipReward: () => finishReward(),
  buy: (i) => {
    const it = run.shop.items[+i];
    if (it.sold || run.gold < it.price) return;
    const done = () => { run.gold -= it.price; it.sold = true; sfx('coin'); save(); showShop(); };
    if (it.kind === 'piece') { if (addPiece(it.type)) done(); }
    else if (it.kind === 'amulet') { run.amulets.push(it.id); done(); }
    else pickPiece(`Quem recebe ${C.MUTATIONS[it.id].name}?`, mutTarget(it.id), (u) => { u.muts.push(it.id); done(); });
  },
  leave: () => leaveNode(),
  eventChoose: (go) => {
    run.event.result = EVENT_FX[go](C.rngFor(run.seed, 'eventfx', run.act, run.pos));
    save(); showEvent();
  },
  restTrain: () => {
    const r = C.rngFor(run.seed, 'rest', run.act, run.pos);
    const canGet = (u) => Object.keys(C.MUTATIONS).some((m) => !C.MUTATIONS[m].hidden && C.canMutate(u.type, u.muts, m));
    pickPiece('Quem vai treinar?', canGet, (u) => {
      const m = r.pick(Object.keys(C.MUTATIONS).filter((k) => !C.MUTATIONS[k].hidden && C.canMutate(u.type, u.muts, k)));
      u.muts.push(m);
      toast(`${C.NAMES[u.type]} aprendeu <b>${C.MUTATIONS[m].name}</b>.`, 3000);
      leaveNode();
    });
  },
  restRecruit: () => {
    const t = C.rngFor(run.seed, 'rest', run.act, run.pos).pick(['N', 'B']);
    if (addPiece(t)) { toast(`Um ${C.NAMES[t]} se junta à fogueira.`); leaveNode(); }
  },
};
$('#menuBtn').onclick = () => { sfx('click'); showMenu(); };
$('#viewBtn').onclick = () => toggleView();

// ================= Input =================
let pointer = null;
cv.addEventListener('pointerdown', (e) => { pointer = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointerup', (e) => {
  if (!pointer) return;
  const moved = Math.hypot(e.clientX - pointer.x, e.clientY - pointer.y);
  pointer = null;
  if (moved < 14) onBoardTap(e.clientX, e.clientY);
});
cv.addEventListener('pointermove', (e) => {
  if (!bt || bt.demo || e.pointerType !== 'mouse') return;
  bt.hover = pickAt(e.clientX, e.clientY);
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
  if ((e.key === 'v' || e.key === 'V') && bt && !bt.demo) toggleView();
});

// Debug hook for automated checks.
window.__pp = {
  get run() { return run; }, get bt() { return bt; }, ACTIONS, onBoardTap, toggleView,
  toScreen: (x, y) => toScreen(x, y),
};
window.__ppReady = true;
$('#loading').remove();
showTitle();
requestAnimationFrame(frame);
</script>
</body>
</html>
