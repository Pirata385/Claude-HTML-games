<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filogênese — galeria de criaturas (teste visual)</title>
<style>
  body { margin: 0; background: #20281f; color: #e8ecd8; font: 13px system-ui, sans-serif; }
  header { padding: 8px 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  canvas { display: block; width: 100%; height: auto; background: #6f9a52; }
  input, button { font: inherit; }
</style>
</head>
<body>
<header>
  <b>Galeria de criaturas</b>
  <label>semente <input id="seed" type="number" value="1" style="width:90px"></label>
  <button id="go">gerar</button>
  <label><input id="anim" type="checkbox" checked> animar</label>
  <span id="info"></span>
</header>
<canvas id="cv" width="1600" height="1500"></canvas>
<script src="../js/util.js"></script>
<script src="../js/settings.js"></script>
<script src="../js/parts.js"></script>
<script src="../js/species.js"></script>
<script src="../js/creaturedraw.js"></script>
<script src="../js/creature.js"></script>
<script>
(function () {
  'use strict';
  const FG = window.FG, cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const q = new URLSearchParams(location.search);
  if (q.get('seed')) document.getElementById('seed').value = q.get('seed');
  let cells = [];
  const COLS = 6, CW = cv.width / COLS, CH = 250;
  function build() {
    const seed = +document.getElementById('seed').value || 1;
    const fauna = FG.Species.generate(seed);
    cells = fauna.list.map((sp, i) => {
      const cx = (i % COLS) * CW + CW / 2, cy = Math.floor(i / COLS) * CH + CH / 2 + 10;
      const c = new FG.Creature(sp, cx + 40, cy, { angle: Math.PI / 2 });
      return { sp, c, cx, cy, t: Math.random() * 6, fam: fauna.families.find((f) => f.id === sp.fam) };
    });
    cv.height = Math.ceil(fauna.list.length / COLS) * CH + 20;
    document.getElementById('info').textContent = fauna.families.length + ' famílias, ' + fauna.list.length + ' espécies';
  }
  const ANIMS = ['bite', 'strike', 'sing', 'dance', 'charm', 'pose', 'spit', 'eat'];
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    step(dt);
    requestAnimationFrame(frame);
  }
  function step(dt) {
    ctx.fillStyle = '#6f9a52'; ctx.fillRect(0, 0, cv.width, cv.height);
    for (const cell of cells) {
      const c = cell.c, big = cell.sp.isTitan;
      cell.t += dt;
      // anda em círculo; a cada 6 s para e faz uma animação
      const ph = cell.t % 7;
      if (ph < 4.6) {
        const a = Math.atan2(c.y - cell.cy, c.x - cell.cx) + Math.PI / 2 + 0.25;
        const rad = Math.hypot(c.x - cell.cx, c.y - cell.cy), pull = (rad - 46) * 0.02;
        c.mx = Math.cos(a) - Math.cos(a - Math.PI / 2 - 0.25) * pull; c.my = Math.sin(a) - Math.sin(a - Math.PI / 2 - 0.25) * pull;
        const l = Math.hypot(c.mx, c.my) || 1; c.mx /= l; c.my /= l;
        c.speedMul = big ? 0.35 : 0.6;
      } else {
        c.mx = c.my = 0;
        if (!c.anim && ph < 4.8) c.play(ANIMS[Math.floor(cell.t / 7) % ANIMS.length], 1.3);
      }
      if (document.getElementById('anim').checked) c.update(dt, null);
      ctx.save();
      if (big) { ctx.translate(cell.cx, cell.cy); ctx.scale(0.42, 0.42); ctx.translate(-cell.cx, -cell.cy); }
      FG.Draw.creature(ctx, c, {});
      ctx.restore();
      ctx.fillStyle = '#0c140c'; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(cell.sp.name.pt, cell.cx, cell.cy + CH / 2 - 34);
      ctx.font = '11px system-ui';
      const s = cell.sp.stats;
      ctx.fillText(cell.fam.theme + ' · ' + cell.sp.niche + ' · N' + cell.sp.tier + ' · ' + s.diet + ' · ' + s.hp + 'pv · ' + s.moveSpeed, cell.cx, cell.cy + CH / 2 - 20);
      ctx.fillText('C ' + s.bite + s.charge + s.spit + s.strike + '  S ' + s.sing + s.dance + s.charm + s.pose, cell.cx, cell.cy + CH / 2 - 7);
    }
  }
  document.getElementById('go').onclick = build;
  build();
  window.__step = (dt, nsteps) => { for (let i = 0; i < nsteps; i++) step(dt); };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
