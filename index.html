<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Claude HTML Games</title>
<!-- ============================== CSS ============================== -->
<style>
:root {
  --bg: #0b0e14; --panel: #141a24; --panel2: #1d2533; --hi: rgba(255, 255, 255, 0.08);
  --ink: #f3ead6; --muted: #9d9686; --accent: #ffd166;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--ink); font: 600 15px/1.45 var(--mono);
  background:
    radial-gradient(circle at 20% 10%, rgba(94, 200, 242, 0.12), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(211, 111, 224, 0.12), transparent 45%),
    repeating-linear-gradient(0deg, transparent 0 3px, rgba(255, 255, 255, 0.015) 3px 4px),
    var(--bg);
  padding: calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
}
main { max-width: 980px; margin: 0 auto; }
header { text-align: center; margin: 12px 0 28px; }
h1 { margin: 0; font-size: clamp(26px, 7vw, 48px); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); text-shadow: 3px 3px 0 #000, -1px -1px 0 #6a4a10; }
header p { margin: 10px auto 0; max-width: 560px; color: var(--muted); font-weight: 500; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
.card {
  display: flex; flex-direction: column; text-decoration: none; color: inherit; overflow: hidden;
  background: var(--panel); border: 3px solid #000; border-radius: 12px; box-shadow: inset 0 0 0 2px var(--hi), 0 5px 0 #000;
  transition: transform 0.12s, box-shadow 0.12s;
}
.card:hover, .card:focus-visible { transform: translateY(-3px); box-shadow: inset 0 0 0 2px rgba(255, 209, 102, 0.35), 0 8px 0 #000; outline: none; }
.card:active { transform: translateY(2px); box-shadow: inset 0 0 0 2px var(--hi), 0 2px 0 #000; }
.art { height: 150px; position: relative; border-bottom: 3px solid #000; image-rendering: pixelated; }
.art canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.body h2 { margin: 0; font-size: 1.1em; letter-spacing: 0.04em; }
.body p { margin: 0; color: #cfc6b0; font-weight: 500; flex: 1; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { font-size: 0.75em; padding: 2px 7px; border: 2px solid #000; border-radius: 5px; background: var(--panel2); color: var(--muted); }
.tabs { display: flex; justify-content: center; gap: 10px; margin: 0 0 24px; }
.tab {
  font: inherit; cursor: pointer; padding: 9px 18px; border: 3px solid #000; border-radius: 9px;
  background: var(--panel); color: var(--muted); box-shadow: inset 0 0 0 2px var(--hi), 0 4px 0 #000;
}
.tab[aria-selected="true"] { background: #4a3a14; color: var(--accent); box-shadow: inset 0 0 0 2px rgba(255, 209, 102, 0.45), 0 4px 0 #000; }
[hidden] { display: none !important; }
.play { align-self: flex-start; margin-top: 4px; padding: 8px 14px; border: 2px solid #000; border-radius: 7px; background: #4a3a14; color: var(--accent); box-shadow: inset 0 0 0 2px rgba(255, 209, 102, 0.45), 0 3px 0 #000; }
footer { text-align: center; color: var(--muted); font-weight: 500; font-size: 0.85em; margin-top: 30px; }
</style>
</head>
<body>
<!-- ============================== HTML ============================== -->
<main>
  <header>
    <h1>Claude HTML Games</h1>
    <p>A collection of self-contained browser games. Pick one to start playing — every game runs locally, with no install.</p>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-jogos" aria-controls="games" aria-selected="true">Jogos</button>
    <button class="tab" role="tab" id="tab-apps" aria-controls="apps" aria-selected="false">Apps</button>
    <button class="tab" role="tab" id="tab-animacoes" aria-controls="animations" aria-selected="false">Animações</button>
  </div>
  <nav class="grid" id="games" role="tabpanel" aria-labelledby="tab-jogos"></nav>
  <nav class="grid" id="apps" role="tabpanel" aria-labelledby="tab-apps" hidden></nav>
  <nav class="grid" id="animations" role="tabpanel" aria-labelledby="tab-animacoes" hidden></nav>
  <footer>Each game, app and animation lives in its own folder with its code and assets.</footer>
</main>
<!-- ============================== JS ============================== -->
<script>
(function () {
  'use strict';
  // Game registry: add new entries here when a game is added to the repository.
  const GAMES = [
    {
      path: 'procedural-marine-bestiary/index.html',
      title: 'Procedural Marine Bestiary',
      desc: 'An infinite procedural ocean to explore.',
      tags: ['ocean', 'procedural', 'exploration'],
      palette: ['#06283d', '#0b4f6c', '#1fa2c4', '#7fdbff', '#f5f3d7'],
      scene: 'sea',
    },
    {
      path: 'procedural-creature-explorer/index.html',
      title: 'Procedural Creature Explorer',
      desc: 'Wander an endless isometric pixel world, discover procedurally evolved insects, mammals, reptiles, birds and chimerids, analyse their anatomy and fill your bestiary.',
      tags: ['isometric', 'pixel art', 'creatures', 'mobile'],
      palette: ['#1c2a1a', '#3f7d3a', '#7cc95a', '#e8d49a', '#d36fe0'],
      scene: 'land',
    },
    {
      path: 'xenospire/index.html',
      title: 'Xenospire — A Torre Infinita',
      desc: 'Beings from across the universe fight their way up an infinite tower in space, with procedural creatures, Spore-style animation and procedurally generated powers on destructible voxel floors. Mobile-first, in Portuguese.',
      tags: ['isometric', 'pixel art', 'procedural powers', 'voxels', 'mobile'],
      palette: ['#0b0820', '#2a1650', '#ffd166', '#5ff0c8', '#ff5ad0'],
      scene: 'spire',
    },
    {
      path: 'descents/index.html',
      title: 'Descents',
      desc: 'A first-person exploration game about descending into a vast, procedurally generated abyss: layers, caves, ruins, creatures and artifacts, all seeded and deterministic. No combat, no hunger — just exploring, discovering and cataloguing.',
      tags: ['3D', 'first-person', 'procedural', 'exploration'],
      palette: ['#05080c', '#122028', '#1f3b45', '#58b7c9', '#ffb37a'],
      scene: 'abyss',
    },
    {
      path: 'procedurality-3d/index.html',
      title: 'Procedurality-3D',
      desc: 'An open-universe observatory you drift through and watch: seeded galaxies, nebulae, stars, planets, ecosystems and civilizations that rise, trade and war on their own. Step into a creature or raise a monolith to change a world.',
      tags: ['3D', 'space', 'procedural', 'simulation'],
      palette: ['#05060b', '#123a52', '#2f8f6b', '#8fe3d0', '#ffd166'],
      scene: 'city',
    },
    {
      path: 'intergalactic-life/index.html',
      title: 'Intergalactic Life',
      desc: 'A 2.5D procedural space exploration, combat, trading and colonization game: fly a block-built ship through a living galaxy of factions and aliens, land on planets, mine and fight, and found colonies of your own.',
      tags: ['2.5D', 'space', 'procedural', 'simulation', 'combat'],
      palette: ['#05060b', '#223047', '#5a7290', '#5ff0c8', '#ffb347'],
      scene: 'dock',
    },
    {
      path: 'chess-roguelike/index.html',
      title: 'Peões & Perdição',
      desc: 'A dark chess roguelike with 3D pieces drawn as fine pixel art, played in isometric or top-down view: lead a permadeath army across three acts of branching maps, mutate your pieces, collect amulets and take down three bosses. Mobile-first, in Portuguese.',
      tags: ['3D', 'pixel art', 'chess', 'roguelike', 'mobile'],
      palette: ['#0f0d12', '#3a3f45', '#6b7062', '#cdc4b4', '#7e3838'],
      scene: 'chess',
    },
    {
      path: 'ultima-barricada/index.html',
      title: 'Última Barricada / Last Barricade',
      desc: 'A zombie-survival RTS in isometric voxel pixel art: lead a squad of survivors through procedural, seeded cities, scavenge hospitals, police stations and gas stations, build walls, towers and generators, and hold the base against ever larger night hordes. Endless with a score, playable with mouse or touch, in Portuguese and English.',
      tags: ['RTS', 'isometric', 'voxels', 'zombies', 'mobile'],
      palette: ['#0b0e18', '#3a5530', '#8a6038', '#e8503a', '#ffd166'],
      scene: 'zombie',
    },
    {
      path: 'singularita/index.html',
      title: 'Singularita — The Broken Isles',
      desc: 'A third-person 3D voxel RPG of exploration, combat and crafting: hold a seeded island against day slimes and night zombies, mine down through seven cave layers from wood to diamond, craft gear for five distinct classes (Swordsman, Archer, Mage, Assassin and the spirit-summoning Stardust) and face the Slime Prince and the Silverback Zombie Emperor. Mouse, keyboard and touch.',
      tags: ['3D', 'voxels', 'RPG', 'crafting', 'mobile'],
      palette: ['#0d1020', '#2b2350', '#4caf6a', '#8a5a3a', '#c48cff'],
      scene: 'singularita',
    },
  ];
  // App registry: entries for the "Apps" tab (tools rather than games; each in its own root folder).
  const APPS = [
    {
      path: 'pulso-daw/index.html',
      title: 'Pulso — Estúdio Musical',
      desc: 'A full music studio in the browser: drum step grid, piano roll, synths with 12 presets, a sampler with mic recording, multiple tracks, mixer, reverb, delay, EQ and compressor, plus WAV and MIDI export. In Portuguese, mouse, keyboard, MIDI and touch.',
      tags: ['music', 'DAW', 'synth', 'tool', 'mobile'],
      palette: ['#0d0f13', '#1d2129', '#ff7a45', '#5ad1ff', '#ffd23f'],
      scene: 'daw',
    },
    {
      path: 'hexel/index.html',
      title: 'Hexel — Pixels em Hexágonos',
      desc: 'Turn any photo into hexagons: 10 styles (cubes, gems, beads, halftone…), palettes with dithering, colour controls, presets, before/after comparison and PNG, JPG, WebP or SVG export. Runs locally, in Portuguese, on desktop and mobile.',
      tags: ['image', 'hexagons', 'tool', 'SVG', 'mobile'],
      palette: ['#121419', '#ffb020', '#43d1c1', '#7b2f7d', '#f0675a'],
      scene: 'hex',
    },
  ];
  // Animation registry: entries for the "Animações" tab (folders under animacoes/).
  const ANIMATIONS = [
    {
      path: 'animacoes/motion-showcase/index.html',
      title: 'Motion Showcase',
      desc: 'A motion design demo that cycles through nine art styles (Bauhaus, generative flow, 8-bit pixel art, sumi-e ink, synthwave, paper cut-out, metaballs, classic animation principles and a harmonograph) with animated transitions.',
      tags: ['motion design', 'canvas', 'generative', 'loop'],
      palette: ['#efe6d2', '#d6402b', '#1f4e9c', '#f2b51d', '#141414'],
      scene: 'motion',
    },
    {
      path: 'animacoes/bloons-sniper/index.html',
      title: 'Operação Vermelho',
      desc: 'A one-minute Bloons TD6 fan short: a sniper on a rainy rooftop takes orders from a secret agent for one perfect shot, until the tone flips and it all ends at a birthday party. In Portuguese, with synthesised sound.',
      tags: ['short film', 'Bloons TD6', 'comedy', 'sound'],
      palette: ['#05070d', '#1c2541', '#e3242b', '#ffd166', '#4b5b2a'],
      scene: 'bloons',
    },
    {
      path: 'animacoes/stickman-duel/index.html',
      title: 'Raio × Sangue',
      desc: 'A 90-second stickman fight: Volt, master of lightning, against Carmim, who bends his own blood. Hand-to-hand combat, spikes and whips, a storm, a beam struggle and one final strike, with impact frames, hit-stop and synthesised sound effects.',
      tags: ['short film', 'stickman', 'action', 'sound'],
      palette: ['#efe6d2', '#121212', '#3ef0ff', '#e01b3c', '#c8372d'],
      scene: 'duel',
    },
    {
      path: 'animacoes/rato-geladeira/index.html',
      title: 'Tico e a Geladeira',
      desc: 'A comic and tragic cartoon short: a rat sees a fridge full of food and tries to open it in ever more ingenious ways (a tower of junk, a catapult, a lasso, dynamite), failing every time. When it finally opens, a slice of cheesecake proves too distracting. In Portuguese, with cartoon sound effects.',
      tags: ['short film', 'cartoon', 'comedy', 'sound'],
      palette: ['#f6e3b4', '#9fd6c2', '#a39a92', '#c95b4a', '#ffd166'],
      scene: 'fridge',
    },
  ];
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  function addCards(nav, list, label) {
    for (const g of list) {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = g.path;
      a.innerHTML = `<div class="art"><canvas width="96" height="40" aria-hidden="true"></canvas></div>
        <div class="body"><h2>${esc(g.title)}</h2><p>${esc(g.desc)}</p>
        <div class="tags">${g.tags.map((t) => `<span>${esc(t)}</span>`).join('')}</div><span class="play">${label}</span></div>`;
      nav.appendChild(a);
      drawArt(a.querySelector('canvas'), g);
    }
  }
  addCards(document.getElementById('games'), GAMES, '▶ Play');
  addCards(document.getElementById('apps'), APPS, '▶ Abrir');
  addCards(document.getElementById('animations'), ANIMATIONS, '▶ Assistir');
  // Tabs: "Jogos", "Apps" and "Animações". The hash (#apps, #animacoes) keeps the tab when coming back from a page.
  const tabs = { jogos: document.getElementById('tab-jogos'), apps: document.getElementById('tab-apps'), animacoes: document.getElementById('tab-animacoes') };
  function showTab(name) {
    for (const [key, btn] of Object.entries(tabs)) {
      btn.setAttribute('aria-selected', String(key === name));
      document.getElementById(btn.getAttribute('aria-controls')).hidden = key !== name;
    }
  }
  tabs.jogos.onclick = () => { showTab('jogos'); history.replaceState(null, '', location.pathname); };
  tabs.apps.onclick = () => { showTab('apps'); history.replaceState(null, '', '#apps'); };
  tabs.animacoes.onclick = () => { showTab('animacoes'); history.replaceState(null, '', '#animacoes'); };
  const fromHash = location.hash.slice(1);
  showTab(fromHash in tabs ? fromHash : 'jogos');
  // Tiny procedural pixel-art banner for each card.
  function drawArt(cv, g) {
    const ctx = cv.getContext('2d'), W = cv.width, H = cv.height, P = g.palette;
    let s = g.title.length * 9301 + 49297;
    const rnd = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
    if (g.scene === 'sea') {
      for (let y = 0; y < H; y++) { ctx.fillStyle = y < 6 ? P[3] : y < 16 ? P[2] : y < 28 ? P[1] : P[0]; ctx.fillRect(0, y, W, 1); }
      for (let i = 0; i < 40; i++) { ctx.fillStyle = P[4]; ctx.fillRect(Math.floor(rnd() * W), 6 + Math.floor(rnd() * 30), 1, 1); }
      for (let k = 0; k < 4; k++) {
        const x = 8 + Math.floor(rnd() * (W - 20)), y = 14 + Math.floor(rnd() * 18);
        ctx.fillStyle = P[4]; ctx.fillRect(x, y, 6, 3); ctx.fillRect(x + 6, y - 1, 2, 5); ctx.fillStyle = '#000'; ctx.fillRect(x + 1, y + 1, 1, 1);
      }
    } else if (g.scene === 'spire') {
      ctx.fillStyle = P[0]; ctx.fillRect(0, 0, W, H);
      for (let i = 0; i < 50; i++) { ctx.fillStyle = rnd() < 0.8 ? '#8c86b8' : P[3]; ctx.fillRect(Math.floor(rnd() * W), Math.floor(rnd() * H), 1, 1); }
      ctx.fillStyle = P[4]; ctx.fillRect(78, 6, 7, 7); ctx.fillStyle = P[0]; ctx.fillRect(81, 6, 4, 3);
      ctx.fillStyle = P[1]; ctx.fillRect(40, 18, 16, H - 18);
      for (let y = 22; y < H; y += 4) for (let x = 42; x < 54; x += 3) { ctx.fillStyle = rnd() < 0.4 ? P[2] : '#1b1236'; ctx.fillRect(x, y, 1, 1); }
      ctx.fillStyle = P[2]; ctx.fillRect(30, 15, 36, 3); ctx.fillStyle = '#b8902e'; ctx.fillRect(30, 18, 36, 1);
      ctx.fillStyle = P[3]; ctx.fillRect(38, 11, 3, 4); ctx.fillRect(37, 12, 1, 1);
      ctx.fillStyle = P[4]; ctx.fillRect(55, 11, 4, 4); ctx.fillStyle = '#fff'; ctx.fillRect(56, 12, 1, 1);
      ctx.fillStyle = P[3]; ctx.fillRect(44, 12, 8, 1); ctx.fillStyle = '#fff'; ctx.fillRect(51, 12, 1, 1);
    } else if (g.scene === 'abyss') {
      ctx.fillStyle = P[1]; ctx.fillRect(0, 0, W, H);
      const cx = 48, cy = 17, rx = 46, ry = 19;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const dx = (x - cx) / rx, dy = (y - cy) / ry, d = Math.sqrt(dx * dx + dy * dy);
        if (d > 1.02) continue;
        ctx.fillStyle = d > 0.82 ? P[3] : d > 0.55 ? P[2] : d > 0.22 ? P[1] : P[0];
        ctx.fillRect(x, y, 1, 1);
      }
      for (let i = 0; i < 10; i++) {
        const a = rnd() * Math.PI * 2, r = rnd() * 8;
        ctx.fillStyle = P[4]; ctx.fillRect(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r * 0.4), 1, 1);
      }
      for (let i = 0; i < 14; i++) {
        const a = rnd() * Math.PI * 2, r = 18 + rnd() * 22;
        const x = Math.round(cx + Math.cos(a) * r), y = Math.round(cy + Math.sin(a) * r * 0.4);
        if (x >= 0 && x < W && y >= 0 && y < H) { ctx.fillStyle = rnd() < 0.5 ? P[3] : '#0d1a20'; ctx.fillRect(x, y, 1, 1); }
      }
      ctx.fillStyle = '#000'; ctx.fillRect(16, 1, 1, 9);
      ctx.fillStyle = P[4]; ctx.fillRect(15, 10, 2, 2);
    } else if (g.scene === 'city') {
      ctx.fillStyle = P[0]; ctx.fillRect(0, 0, W, H);
      for (let i = 0; i < 40; i++) { ctx.fillStyle = rnd() < 0.85 ? '#8fa3bf' : P[3]; ctx.fillRect(Math.floor(rnd() * W), Math.floor(rnd() * 22), 1, 1); }
      ctx.fillStyle = '#d8dde6'; ctx.fillRect(80, 4, 5, 5); ctx.fillStyle = P[0]; ctx.fillRect(82, 4, 2, 2);
      const pcx = 48, pcy = 50, pr = 30;
      const surfaceY = (x) => pcy - Math.sqrt(Math.max(0, pr * pr - (x - pcx) * (x - pcx)));
      for (let y = 0; y < H; y++) {
        const dy = y - pcy;
        if (Math.abs(dy) > pr) continue;
        const hw = Math.sqrt(pr * pr - dy * dy), x0 = Math.round(pcx - hw), x1 = Math.round(pcx + hw);
        for (let x = Math.max(0, x0); x <= Math.min(W - 1, x1); x++) {
          const n = Math.sin(x * 0.3 + y * 0.17) + Math.sin(x * 0.13 - y * 0.21) * 0.6;
          ctx.fillStyle = n > 0.3 ? P[2] : P[1]; ctx.fillRect(x, y, 1, 1);
        }
        if (x0 >= 0 && x0 < W) { ctx.fillStyle = P[3]; ctx.fillRect(x0, y, 1, 1); }
        if (x1 >= 0 && x1 < W) { ctx.fillStyle = P[3]; ctx.fillRect(x1, y, 1, 1); }
      }
      for (let i = 0; i < 9; i++) {
        const x = 32 + Math.floor(rnd() * 32), sy = Math.round(surfaceY(x));
        if (sy >= H) continue;
        const h = 2 + Math.floor(rnd() * 5);
        ctx.fillStyle = '#10151c'; ctx.fillRect(x, sy - h, 2, h);
        if (rnd() < 0.7) { ctx.fillStyle = P[4]; ctx.fillRect(x, sy - h + (h > 2 ? 1 : 0), 1, 1); }
      }
    } else if (g.scene === 'dock') {
      ctx.fillStyle = P[0]; ctx.fillRect(0, 0, W, H);
      for (let i = 0; i < 36; i++) { ctx.fillStyle = rnd() < 0.8 ? '#8aa0c0' : P[3]; ctx.fillRect(Math.floor(rnd() * W), Math.floor(rnd() * H), 1, 1); }
      ctx.fillStyle = P[1]; ctx.fillRect(75, 6, 6, 28);
      ctx.fillStyle = P[2]; ctx.fillRect(65, 17, 28, 4);
      for (let x = 66; x < 93; x += 4) { ctx.fillStyle = '#0b1520'; ctx.fillRect(x, 17, 1, 4); }
      ctx.fillStyle = P[2]; ctx.fillRect(66, 19, 6, 3);
      ctx.fillStyle = P[3]; ctx.fillRect(66, 20, 1, 1);
      for (let x = 34; x < 66; x += 3) { ctx.fillStyle = rnd() < 0.6 ? P[3] : '#163041'; ctx.fillRect(x, 20, 2, 1); }
      ctx.fillStyle = P[2]; ctx.fillRect(12, 16, 22, 8);
      ctx.fillStyle = P[1]; ctx.fillRect(14, 13, 5, 3); ctx.fillRect(20, 13, 5, 3); ctx.fillRect(26, 13, 5, 3);
      ctx.fillStyle = '#0b1520'; ctx.fillRect(19, 13, 1, 3); ctx.fillRect(25, 13, 1, 3);
      ctx.fillStyle = P[3]; ctx.fillRect(31, 19, 2, 2);
      ctx.fillStyle = P[4]; ctx.fillRect(9, 19, 3, 2); ctx.fillRect(6, 20, 2, 1); ctx.fillRect(3, 20, 1, 1);
    } else if (g.scene === 'chess') {
      for (let y = 0; y < H; y++) { ctx.fillStyle = y < 14 ? P[0] : y < 26 ? '#16141a' : '#1c1a20'; ctx.fillRect(0, y, W, 1); }
      for (let i = 0; i < 24; i++) { ctx.fillStyle = '#2e3238'; ctx.fillRect(Math.floor(rnd() * W), Math.floor(rnd() * H), 1, 2); }
      // Isometric 4x4 board: top faces, then 3px of stone below them.
      const tileAt = (px, py) => {
        const dx = (px - 48) / 7, dy = (py - 13) / 3.5, fx = (dx + dy) / 2, fy = (dy - dx) / 2;
        return fx >= 0 && fy >= 0 && fx < 4 && fy < 4 ? (Math.floor(fx) + Math.floor(fy)) % 2 : -1;
      };
      for (let py = 0; py < H; py++) for (let px = 0; px < W; px++) {
        const t = tileAt(px, py);
        if (t >= 0) { ctx.fillStyle = t ? '#4f544a' : P[2]; ctx.fillRect(px, py, 1, 1); continue; }
        for (let k = 1; k <= 3; k++) if (tileAt(px, py - k) >= 0) { ctx.fillStyle = px < 48 ? '#3a3732' : '#26241f'; ctx.fillRect(px, py, 1, 1); break; }
      }
      // A bone pawn facing an iron king, with a lantern on the far corner.
      ctx.fillStyle = '#08070a'; ctx.fillRect(37, 17, 5, 10); ctx.fillRect(36, 24, 7, 3);
      ctx.fillStyle = P[3]; ctx.fillRect(38, 18, 3, 3); ctx.fillRect(38, 21, 3, 4); ctx.fillRect(37, 25, 5, 1);
