<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Claude HTML Games</title>
<!-- ============================== CSS ============================== -->
<style>
:root {
  --bg: #0b0e14; --panel: #141a24; --panel2: #1d2533; --hi: rgba(255, 255, 255, 0.08);
  --ink: #f3ead6; --muted: #9d9686; --accent: #ffd166;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--ink); font: 600 15px/1.45 var(--mono);
  background:
    radial-gradient(circle at 20% 10%, rgba(94, 200, 242, 0.12), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(211, 111, 224, 0.12), transparent 45%),
    repeating-linear-gradient(0deg, transparent 0 3px, rgba(255, 255, 255, 0.015) 3px 4px),
    var(--bg);
  padding: calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
}
main { max-width: 980px; margin: 0 auto; }
header { text-align: center; margin: 12px 0 28px; }
h1 { margin: 0; font-size: clamp(26px, 7vw, 48px); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); text-shadow: 3px 3px 0 #000, -1px -1px 0 #6a4a10; }
header p { margin: 10px auto 0; max-width: 560px; color: var(--muted); font-weight: 500; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
.card {
  display: flex; flex-direction: column; text-decoration: none; color: inherit; overflow: hidden;
  background: var(--panel); border: 3px solid #000; border-radius: 12px; box-shadow: inset 0 0 0 2px var(--hi), 0 5px 0 #000;
  transition: transform 0.12s, box-shadow 0.12s;
}
.card:hover, .card:focus-visible { transform: translateY(-3px); box-shadow: inset 0 0 0 2px rgba(255, 209, 102, 0.35), 0 8px 0 #000; outline: none; }
.card:active { transform: translateY(2px); box-shadow: inset 0 0 0 2px var(--hi), 0 2px 0 #000; }
.art { height: 150px; position: relative; border-bottom: 3px solid #000; image-rendering: pixelated; }
.art canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.body h2 { margin: 0; font-size: 1.1em; letter-spacing: 0.04em; }
.body p { margin: 0; color: #cfc6b0; font-weight: 500; flex: 1; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { font-size: 0.75em; padding: 2px 7px; border: 2px solid #000; border-radius: 5px; background: var(--panel2); color: var(--muted); }
.play { align-self: flex-start; margin-top: 4px; padding: 8px 14px; border: 2px solid #000; border-radius: 7px; background: #4a3a14; color: var(--accent); box-shadow: inset 0 0 0 2px rgba(255, 209, 102, 0.45), 0 3px 0 #000; }
footer { text-align: center; color: var(--muted); font-weight: 500; font-size: 0.85em; margin-top: 30px; }
</style>
</head>
<body>
<!-- ============================== HTML ============================== -->
<main>
  <header>
    <h1>Claude HTML Games</h1>
    <p>A collection of self-contained browser games. Pick one to start playing — every game runs locally, with no install.</p>
  </header>
  <nav class="grid" id="games"></nav>
  <footer>Each game lives in its own folder with its code and assets.</footer>
</main>
<!-- ============================== JS ============================== -->
<script>
(function () {
  'use strict';
  // Game registry: add new entries here when a game is added to the repository.
  const GAMES = [
    {
      path: 'procedural-marine-bestiary/index.html',
      title: 'Procedural Marine Bestiary',
      desc: 'An infinite procedural ocean to explore.',
      tags: ['ocean', 'procedural', 'exploration'],
      palette: ['#06283d', '#0b4f6c', '#1fa2c4', '#7fdbff', '#f5f3d7'],
      scene: 'sea',
    },
    {
      path: 'procedural-creature-explorer/index.html',
      title: 'Procedural Creature Explorer',
      desc: 'Wander an endless isometric pixel world, discover procedurally evolved insects, mammals, reptiles, birds and chimerids, analyse their anatomy and fill your bestiary.',
      tags: ['isometric', 'pixel art', 'creatures', 'mobile'],
      palette: ['#1c2a1a', '#3f7d3a', '#7cc95a', '#e8d49a', '#d36fe0'],
      scene: 'land',
    },
  ];
  const nav = document.getElementById('games');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  for (const g of GAMES) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = g.path;
    a.innerHTML = `<div class="art"><canvas width="96" height="40" aria-hidden="true"></canvas></div>
      <div class="body"><h2>${esc(g.title)}</h2><p>${esc(g.desc)}</p>
      <div class="tags">${g.tags.map((t) => `<span>${esc(t)}</span>`).join('')}</div><span class="play">▶ Play</span></div>`;
    nav.appendChild(a);
    drawArt(a.querySelector('canvas'), g);
  }
  // Tiny procedural pixel-art banner for each card.
  function drawArt(cv, g) {
    const ctx = cv.getContext('2d'), W = cv.width, H = cv.height, P = g.palette;
    let s = g.title.length * 9301 + 49297;
    const rnd = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
    if (g.scene === 'sea') {
      for (let y = 0; y < H; y++) { ctx.fillStyle = y < 6 ? P[3] : y < 16 ? P[2] : y < 28 ? P[1] : P[0]; ctx.fillRect(0, y, W, 1); }
      for (let i = 0; i < 40; i++) { ctx.fillStyle = P[4]; ctx.fillRect(Math.floor(rnd() * W), 6 + Math.floor(rnd() * 30), 1, 1); }
      for (let k = 0; k < 4; k++) {
        const x = 8 + Math.floor(rnd() * (W - 20)), y = 14 + Math.floor(rnd() * 18);
        ctx.fillStyle = P[4]; ctx.fillRect(x, y, 6, 3); ctx.fillRect(x + 6, y - 1, 2, 5); ctx.fillStyle = '#000'; ctx.fillRect(x + 1, y + 1, 1, 1);
      }
    } else {
      ctx.fillStyle = '#5ea8c9'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#f7e3a1'; ctx.fillRect(74, 5, 6, 6);
      for (let x = 0; x < W; x++) {
        const h = 20 + Math.round(Math.sin(x * 0.11) * 4 + Math.sin(x * 0.31) * 2);
        ctx.fillStyle = P[1]; ctx.fillRect(x, h, 1, H - h);
        ctx.fillStyle = P[2]; ctx.fillRect(x, h, 1, 2);
      }
      for (let i = 0; i < 7; i++) {
        const x = Math.floor(rnd() * W), y = 18 + Math.floor(rnd() * 6);
        ctx.fillStyle = '#6b4e2e'; ctx.fillRect(x, y, 1, 5); ctx.fillStyle = P[0]; ctx.fillRect(x - 2, y - 4, 5, 4);
      }
      ctx.fillStyle = P[4]; ctx.fillRect(40, 27, 8, 4); ctx.fillRect(47, 25, 3, 3);
      ctx.fillStyle = '#000'; ctx.fillRect(41, 31, 1, 2); ctx.fillRect(46, 31, 1, 2); ctx.fillRect(49, 26, 1, 1);
      ctx.fillStyle = P[3]; ctx.fillRect(60, 30, 6, 3); ctx.fillStyle = '#000'; ctx.fillRect(60, 33, 1, 1); ctx.fillRect(62, 33, 1, 1); ctx.fillRect(64, 33, 1, 1);
    }
  }
})();
</script>
</body>
</html>
