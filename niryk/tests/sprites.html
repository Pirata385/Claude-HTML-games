<!DOCTYPE html><html><head><meta charset="utf-8"><title>Niryk sprite sheet</title>
<style>body{background:#2a2438;margin:0;font:12px monospace;color:#ddd}canvas{image-rendering:pixelated}</style></head>
<body><canvas id="c" width="1400" height="1100"></canvas>
<script src="../js/core.js"></script><script src="../js/data.js"></script><script src="../js/sprites.js"></script>
<script>
const S=N.S, c=document.getElementById('c'), x=c.getContext('2d'); x.imageSmoothingEnabled=false;
let px=10, py=10, rowH=0; const sc=4;
function put(img,label){ if(px+img.width*sc>1390){px=10;py+=rowH+16;rowH=0;} x.drawImage(img,px,py,img.width*sc,img.height*sc); x.fillStyle='#ddd'; x.fillText(label,px,py+img.height*sc+11); px+=Math.max(img.width*sc,label.length*7)+12; rowH=Math.max(rowH,img.height*sc); }
for(const k in S.ch) S.ch[k].forEach((f,i)=>put(f,k+i));
for(const k in S.en) put(S.en[k][0],k);
for(const k in S.boss) put(S.boss[k][0],k);
for(const k in S.wp) put(S.wp[k],k);
for(const k in S.eq) put(S.eq[k],k);
for(const k in S.ab) put(S.ab[k],k);
for(const k in S.misc){ const v=S.misc[k]; if(Array.isArray(v)) put(v[0],k); else if(v&&v.width) put(v,k); }
for(const k in S.tiles){ const t=S.tiles[k]; t.floor.forEach((f,i)=>put(f,k+'f'+i)); put(t.top,'top'); put(t.face,'face'); put(t.block,'block'); t.decor.forEach((d,i)=>put(d,'d'+i)); }
</script></body></html>
