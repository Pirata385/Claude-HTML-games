<!DOCTYPE html><html><head><meta charset="utf-8"><title>Niryk sprite sheet</title>
<style>body{background:#2a2438;margin:0;font:12px monospace;color:#ddd}canvas{image-rendering:pixelated}</style></head>
<body><canvas id="c" width="1600" height="2400"></canvas>
<script src="../js/core.js"></script><script src="../js/data.js"></script><script src="../js/sprites.js"></script><script src="../js/sprites2.js"></script>
<script>
// Sheet of every sprite (open in a browser to review the art).
const S=N.S, c=document.getElementById('c'), x=c.getContext('2d'); x.imageSmoothingEnabled=false;
let px=10, py=10, rowH=0; const sc=+(new URLSearchParams(location.search).get('s')||3);
function put(img,label,s=sc){ if(!img) return; if(px+img.width*s>1590){px=10;py+=rowH+16;rowH=0;} x.drawImage(img,px,py,img.width*s,img.height*s); x.fillStyle='#ddd'; x.fillText(label,px,py+img.height*s+11); px+=Math.max(img.width*s,label.length*7)+12; rowH=Math.max(rowH,img.height*s); }
function br(){ px=10; py+=rowH+20; rowH=0; }
for(const k in S.ch) S.ch[k].forEach((f,i)=>put(f,k+i)); br();
for(const k in S.en) put(S.en[k][0],k); br();
for(const k in S.boss) put(S.boss[k][0],k,2); br();
for(const k in S.wp) put(S.wp[k],k); for(const k in S.eq) put(S.eq[k],k); br();
for(const k in S.ab) put(S.ab[k],k,2); br();
for(const k in S.misc){ const v=S.misc[k]; if(Array.isArray(v)) put(v[0],k,2); else if(v&&v.width) put(v,k,2); }
br(); for(const k in S.deco){ const v=S.deco[k]; if(v&&v.width) put(v,k,2); }
br(); for(const k in S.tiles){ const t=S.tiles[k]; put(t.floor,k,1); t.faces.forEach((f,i)=>put(f,'face'+i,2)); put(t.cap,'cap',2); put(t.void,'void',1); t.patches.forEach((p,i)=>put(p,'patch',1)); br(); }
</script></body></html>
