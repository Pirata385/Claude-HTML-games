<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1020">
  <title>Singularita — The Broken Isles</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/menus.css">
  <link rel="stylesheet" href="css/touch.css">
  <script type="importmap">
    { "imports": { "three": "./lib/three/three.module.min.js" } }
  </script>
</head>
<body>
  <div id="game-root">
    <div id="viewport"></div>
    <canvas id="overlay2d"></canvas>
    <div id="hud" hidden></div>
    <div id="touch" hidden></div>
    <div id="menu" hidden></div>
    <div id="dialog" hidden></div>
    <div id="screens"></div>
    <div id="loading">
      <div class="loading-inner">
        <div class="logo">SINGULARITA</div>
        <div class="sub">The Broken Isles</div>
        <div class="bar"><div class="fill" id="loading-fill"></div></div>
        <div class="msg" id="loading-msg">Waking the Beacon…</div>
      </div>
    </div>
    <noscript><p class="noscript">Singularita needs JavaScript and a modern browser with WebGL.</p></noscript>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
